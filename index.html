<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-wrapper">
        <div class="menu-drag-bar" title="Drag to move menu"></div>
        <div class="menu-container">
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <span class="brand-main">Solaris</span> <span class="brand-sub">Menu</span>
                </div>
                <nav class="sidebar-nav">
                    <div class="nav-section">
                        <div class="nav-section-title">Main</div>
                        <a href="#" class="nav-item active" data-category="player">
                            <i class="fa-solid fa-user"></i> Self Options
                        </a>
                        <a href="#" class="nav-item" data-category="combat">
                            <i class="fa-solid fa-crosshairs"></i> Combat Options
                        </a>
                        <a href="#" class="nav-item" data-category="weaponry">
                            <i class="fa-solid fa-gun"></i> Weapon Options
                        </a>
                        <a href="#" class="nav-item" data-category="vehicles">
                            <i class="fa-solid fa-car"></i> Vehicle Options
                        </a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">World</div>
                        <a href="#" class="nav-item" data-category="players">
                            <i class="fa-solid fa-users"></i> Online Options
                        </a>
                        <a href="#" class="nav-item" data-category="server">
                            <i class="fa-solid fa-earth-americas"></i> World Options
                        </a>
                        <a href="#" class="nav-item" data-category="assists">
                            <i class="fa-solid fa-toolbox"></i> Misc Options
                        </a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">Extra</div>
                        <a href="#" class="nav-item" data-category="protections">
                            <i class="fa-solid fa-shield-halved"></i> Protections
                        </a>
                        <a href="#" class="nav-item" data-category="settings">
                            <i class="fa-solid fa-gear"></i> Settings
                        </a>
                    </div>
                </nav>
            </aside>

            <main class="main-content">
                <div class="top-bar">
                    <div class="sub-tabs" id="sub-tabs"></div>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="function-search" placeholder="Search">
                    </div>
                </div>
                <div class="content-grid" id="tile-grid"></div>
            </main>
        </div>
        <div id="notification" class="notification" aria-live="polite"></div>
    </div>
    <div id="sol-bridge" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;" aria-hidden="true"></div>

    <script src="script.js"></script>
</body>
</html>
