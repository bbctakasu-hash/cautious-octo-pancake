<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris Menu</title>
    <style>
/* System fonts in-game (no Google Fonts CDN = faster load, sharper DUI text). */

:root {
    --theme: 15, 98, 254;
    --bg: 0, 0, 0;
    --surface: 5, 5, 5;
    --text-primary: #ffffff;
    --text-secondary: #E2E8F0;
    --text-muted: #64748b;
    --radius: 14px;
    --item-radius: 10px;
    --glow-soft: 0 0 40px -8px rgba(var(--theme), 0.3);
    --glow-strong: 0 0 60px -5px rgba(var(--theme), 0.45);
    /* Selector + washed bars (from dui/index.html) */
    --sel-left: rgb(4, 23, 89);
    --sel-right: rgb(0, 0, 0);
    --sel-bar: rgb(3, 123, 252);
    --sel-top-bar: rgb(0, 102, 204);
}

@import url('https://fonts.cdnfonts.com/css/google-sans');

body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    font-family: 'Google Sans', 'Product Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

/* In-game (DUI) mode keeps the page transparent so only the panel renders.
   The `.standalone` class is added by script.js when opened directly in a
   browser, restoring the ambient backdrop for previewing. */
body.standalone {
    background: #050308;
    background-image:
        radial-gradient(ellipse at 20% 50%, rgba(var(--theme), 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 30%, rgba(120, 10, 10, 0.05) 0%, transparent 50%);
}

/* In-game DUI: only the panel is visible; rest of the texture must stay clear */
html, body,
html.dui-mode,
body.dui-mode {
    background: transparent !important;
    background-color: transparent !important;
    width: 100%;
    height: 100%;
}
body.dui-mode .loader-overlay {
    display: none !important;
}
body.dui-mode .menu-container.hidden {
    transform: none;
    opacity: 0;
    pointer-events: none;
    transition: none;
}
/* In-game: HUD pills are not drawn in the menu texture (Lua draws HUD when menu is closed) */
body.dui-mode .watermark-pill {
    display: none !important;
}

body.dui-mode .header-banner {
    display: none !important;
    height: 0 !important;
}

body.dui-mode .menu-container {
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    font-size: 14px;
    animation: none;
    opacity: 1 !important;
    border: none !important;
    box-shadow: none !important;
    outline: none !important;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
}
body.dui-mode .menu-container:not(.hidden) {
    transform: none !important;
    pointer-events: none;
    transition: none;
}

body.dui-mode .content {
    flex: 1 1 auto;
    min-height: 0;
}

body.dui-mode .tabs {
    flex-shrink: 0;
}

/* Hidden state — Lua toggles this via the bridge */
.menu-container.hidden {
    opacity: 0;
    transform: scale(0.96) translateY(12px);
    pointer-events: none;
}

/* ───────── Container ───────── */
.menu-container {
    position: absolute;
    top: 15vh;
    left: 8vw;
    width: 440px;
    border-radius: 8px;
    background: #02040A;
    border: none;
    box-shadow: none;
    overflow: visible;
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    animation: menuAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transform-origin: top center;
    transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes menuAppear {
    0% { opacity: 0; transform: scale(0.96) translateY(12px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

/* ───────── Banner ───────── */
.header-banner {
    width: 100%;
    height: 110px;
    background-color: #02040A;
    background-image: url('https://placehold.co/400x110/02040A/64748b?text=Banner+Image+Placeholder');
    background-size: cover;
    background-position: center;
    position: relative;
    border-radius: 8px 8px 0 0;
    overflow: hidden;
}

/* ───────── Tabs ───────── */
.tabs {
    display: flex;
    padding: 0;
    background: #02040A;
    position: relative;
    z-index: 6;
}

.tab {
    flex: 1;
    text-align: center;
    padding: 14px 0;
    font-size: 13px;
    font-weight: 700;
    color: #94a3b8;
    cursor: pointer;
    text-transform: capitalize;
    background: #000000;
    transition: color 0.15s ease, background 0.15s ease;
    position: relative;
    z-index: 1;
}

.tab:hover {
    color: #ffffff;
    background: #0a1020;
}

.tab.active {
    color: #ffffff;
    background: linear-gradient(
        to top,
        var(--sel-left) 0%,
        var(--sel-top-bar) 100%
    );
    box-shadow: none;
}

/* ───────── Content ───────── */
.content {
    padding: 0;
    position: relative;
    flex: 0 0 auto;
    overflow: visible;
}

.menu-viewport {
    position: relative;
    z-index: 1;
    width: 100%;
    flex: 0 0 auto;
    transform-origin: top center;
    overflow: hidden;
    margin: 11px 0;
}

/* Category swap — fast + heavy (~0.4s); list only, selector stays fixed */
.menu-viewport.page-out-forward {
    animation: menuPageOutForward 0.085s cubic-bezier(0.85, 0, 1, 0.15) forwards;
}

.menu-viewport.page-out-backward {
    animation: menuPageOutBackward 0.085s cubic-bezier(0.85, 0, 1, 0.15) forwards;
}

.menu-viewport.page-in-forward {
    animation: menuPageInForward 0.32s cubic-bezier(0.14, 1.25, 0.34, 1) forwards;
}

.menu-viewport.page-in-backward {
    animation: menuPageInBackward 0.32s cubic-bezier(0.14, 1.25, 0.34, 1) forwards;
}

.menu-viewport.page-in-forward .menu-item,
.menu-viewport.page-in-backward .menu-item {
    animation: menuItemIn 0.28s cubic-bezier(0.2, 1, 0.4, 1) backwards;
}

.menu-viewport.page-in-forward .menu-item:nth-child(1),
.menu-viewport.page-in-backward .menu-item:nth-child(1) { animation-delay: 0.02s; }
.menu-viewport.page-in-forward .menu-item:nth-child(2),
.menu-viewport.page-in-backward .menu-item:nth-child(2) { animation-delay: 0.03s; }
.menu-viewport.page-in-forward .menu-item:nth-child(3),
.menu-viewport.page-in-backward .menu-item:nth-child(3) { animation-delay: 0.04s; }
.menu-viewport.page-in-forward .menu-item:nth-child(4),
.menu-viewport.page-in-backward .menu-item:nth-child(4) { animation-delay: 0.05s; }
.menu-viewport.page-in-forward .menu-item:nth-child(5),
.menu-viewport.page-in-backward .menu-item:nth-child(5) { animation-delay: 0.06s; }
.menu-viewport.page-in-forward .menu-item:nth-child(n+6),
.menu-viewport.page-in-backward .menu-item:nth-child(n+6) { animation-delay: 0.07s; }

@keyframes menuPageOutForward {
    to {
        transform: translateX(-22px) scale(0.97);
        opacity: 0;
    }
}

@keyframes menuPageOutBackward {
    to {
        transform: translateX(22px) scale(0.97);
        opacity: 0;
    }
}

@keyframes menuPageInForward {
    from {
        transform: translateX(28px) scale(0.965);
        opacity: 0;
    }
    to {
        transform: translateX(0) scale(1);
        opacity: 1;
    }
}

@keyframes menuPageInBackward {
    from {
        transform: translateX(-28px) scale(0.965);
        opacity: 0;
    }
    to {
        transform: translateX(0) scale(1);
        opacity: 1;
    }
}

@keyframes menuItemIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* Floating selector — outside animated viewport so it never rides the transition */
.menu-selector {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 48px;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    box-sizing: border-box;
    border-radius: 0;
    background: linear-gradient(
        90deg,
        var(--sel-left) 0%,
        rgb(2, 12, 44) 38%,
        rgb(1, 6, 20) 62%,
        var(--sel-right) 100%
    );
    box-shadow:
        0 0 14px rgba(3, 123, 252, 0.28),
        0 0 28px rgba(4, 23, 89, 0.4),
        inset 0 0 18px rgba(3, 123, 252, 0.06);
}

/* Thin washed bars sit OUTSIDE the row (original layout) */
.menu-selector::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -11px;
    height: 11px;
    pointer-events: none;
    background: linear-gradient(
        180deg,
        rgba(0, 102, 204, 0) 0%,
        rgba(0, 102, 204, 0.18) 40%,
        rgba(0, 102, 204, 0.7) 88%,
        var(--sel-top-bar) 100%
    );
}

.menu-selector::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -11px;
    height: 11px;
    pointer-events: none;
    background: linear-gradient(
        0deg,
        rgba(3, 123, 252, 0) 0%,
        rgba(3, 123, 252, 0.2) 45%,
        rgba(3, 123, 252, 0.75) 85%,
        var(--sel-bar) 100%
    );
}

/* ─── Custom Scrollbar (neon) — floats OUTSIDE the panel, to its left ─── */
.scroll-track {
    display: none !important;
}

.scroll-arrow-top,
.scroll-arrow-bottom {
    position: absolute;
    left: 0;
    width: 8px;
    text-align: center;
    font-size: 9px;
    color: rgba(var(--theme), 0.8);
    pointer-events: none;
    transition: top 0.05s linear;
    text-shadow: 0 0 6px rgba(var(--theme), 0.5);
}

.scroll-thumb {
    position: absolute;
    left: 2px;
    width: 4px;
    height: 30px;
    background: rgb(var(--theme));
    border-radius: 10px;
    box-shadow: 0 0 16px rgba(var(--theme), 0.9), 0 0 8px rgba(var(--theme), 0.6);
    transition: top 0.05s linear, height 0.1s ease;
}

.menu-list {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
    height: auto;
    max-height: 500px;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0;
    margin: 0;
    position: relative;
    z-index: 1;
    transition: height 0.18s ease;
    flex-shrink: 0;
}

/* Scrollbar */
.menu-list::-webkit-scrollbar { display: none; }
.menu-list { -ms-overflow-style: none; scrollbar-width: none; }

/* ───────── Menu Items ───────── */
.menu-item {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    width: 100%;
    height: 48px;
    flex-shrink: 0;
    padding: 0 20px;
    margin: 0;
    cursor: pointer;
    border: none;
    background: transparent;
    position: relative;
    z-index: 1;
    isolation: isolate;
    overflow: visible;
    background: transparent !important;
    box-shadow: none !important;
    transition: color 0.16s ease;
}

/* ─── Item Icon ─── */
.item-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    margin-right: 14px;
    color: var(--text-muted);
    transition: color 0.18s ease;
    z-index: 2;
    flex-shrink: 0;
}

.item-icon svg.menu-svg-icon {
    width: 20px;
    height: 20px;
    transition: transform 0.14s ease, color 0.18s ease;
}

.menu-item .item-name {
    flex: 1;
    font-size: 15.2px;
    font-weight: 600;
    color: var(--text-secondary);
    transition: color 0.18s ease;
    z-index: 2;
    letter-spacing: 0.2px;
}

.menu-item .item-arrow {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    min-width: 20px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    color: #94a3b8;
    opacity: 0.65;
    z-index: 2;
    transition: color 0.18s ease, opacity 0.18s ease;
}

.menu-item .item-arrow.item-arrow--dim {
    opacity: 0.32;
}

/* ─── Hover (subtle — no row scale) ─── */
.menu-item:not(.active):hover {
    background: rgba(var(--theme), 0.04);
}
.menu-item:not(.active):hover .item-name { color: #ccc; }
.menu-item:not(.active):hover .item-arrow { opacity: 0.85; }
.menu-item:not(.active):hover .item-icon { color: #999; }
.menu-item:not(.active):hover .item-icon svg.menu-svg-icon {
    transform: scale(1.02);
}

/* Active row — text highlight only (bar is .menu-selector) */
.menu-item.active::before,
.menu-item.active::after {
    display: none !important;
    content: none !important;
}

.menu-item.active {
    z-index: 2;
}

.menu-item.active .item-icon,
.menu-item.active .item-name,
.menu-item.active .item-arrow,
.menu-item.active .item-name-wrap,
.menu-item.active .toggle-switch,
.menu-item.active .slider-container,
.menu-item.active .array-container,
.menu-item.active .bind-badge,
.menu-item.active .keybind-badge,
.menu-item.active .info-value,
.menu-item.active .color-preview {
    position: relative;
    z-index: 3;
}

.menu-item.active .item-icon {
    color: #fff;
    filter: none;
}

.menu-item.active .item-name {
    color: #fff;
    font-weight: 500;
    text-shadow: none;
}

.menu-item.active .item-arrow {
    color: rgba(255, 255, 255, 0.7);
    opacity: 1;
}

/* ─── Click state ─── */
.menu-item.pressed {
    transform: scale(0.992);
    transition: transform 0.08s ease;
}

/* ───────── Footer ───────── */
.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: #02040A;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.5px;
    border-radius: 0 0 var(--radius) var(--radius);
}

.footer .discord {
    transition: color 0.25s;
    cursor: pointer;
    color: #888;
}
.footer .discord:hover { color: #fff; }

.footer .page-count {
    background: #0F172A;
    border: none;
    padding: 5px 12px;
    border-radius: 6px;
    color: #3B82F6;
    font-size: 12px;
    font-weight: 700;
}

/* ───────── UI Components ───────── */
/* Sliders */
.slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: 5px;
    z-index: 2;
}
.slider-track {
    width: 60px;
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
}
.slider-fill {
    height: 100%;
    background: #0f62fe;
    border-radius: 4px;
    transition: width 0.1s ease;
}
.slider-value {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    min-width: 22px;
    text-align: right;
}
.menu-item.active .slider-value { color: #fff; }

/* Toggles */
.toggle-switch {
    width: 34px;
    height: 18px;
    background: rgba(255,255,255,0.08);
    border-radius: 18px;
    position: relative;
    transition: background 0.3s ease;
    margin-right: 5px;
    z-index: 2;
}
.toggle-knob {
    width: 14px;
    height: 14px;
    background: #888;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
}
.toggle-switch.on {
    background: #0f62fe;
}
.toggle-switch.on .toggle-knob {
    background: #fff;
    transform: translateX(16px);
}

/* ───────── Separator ───────── */
.menu-separator {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    opacity: 0.7;
}

.separator-text {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 0 10px;
    white-space: nowrap;
}

.separator-line {
    flex: 1;
    height: 1px;
    background: rgba(var(--theme), 0.1);
}

/* ───────── Array Selector ───────── */
.array-container {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 13.5px;
    z-index: 2;
}

.array-arrow {
    font-size: 11px;
    opacity: 0.5;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
}

.array-arrow.pressed {
    transform: scale(0.8);
    opacity: 1;
}

.menu-item.active .array-container { color: #fff; }
.menu-item.active .array-arrow { opacity: 0.8; }
.menu-item.active .array-arrow:hover { opacity: 1; }

.array-value {
    min-width: 60px;
    text-align: right;
    font-weight: 500;
}

/* ───────── Color Picker ───────── */
.color-preview {
    width: 24px;
    height: 16px;
    border-radius: 6px;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    z-index: 2;
    margin-right: 0;
}

/* ───────── Banner Identity Overlay ───────── */
.banner-identity {
    position: absolute;
    left: 16px;
    bottom: 10px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
}

.banner-identity .bi-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(var(--theme), 0.6);
    box-shadow: 0 0 14px rgba(var(--theme), 0.5);
    background: rgba(var(--surface), 1);
}

.banner-identity .bi-text { display: flex; flex-direction: column; line-height: 1.25; }
.banner-identity .bi-name {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8), 0 0 16px rgba(var(--theme), 0.5);
    letter-spacing: 0.3px;
}
.banner-identity .bi-sub {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-secondary);
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    letter-spacing: 0.4px;
}

.banner-brand {
    position: absolute;
    right: 14px;
    bottom: 10px;
    z-index: 3;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgb(var(--theme));
    text-shadow: 0 0 18px rgba(var(--theme), 0.8), 0 1px 4px rgba(0,0,0,0.9);
    pointer-events: none;
}

/* ───────── Info / Read-only Rows ───────── */
.menu-item.is-info { cursor: default; }
.menu-item.is-info:hover { background: transparent; }

.info-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    max-width: 210px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
    z-index: 2;
}
.menu-item.active .info-value { color: #fff; }

/* Small status pill used by some rows (e.g. enabled/disabled badges) */
.status-pill {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 2px 9px;
    border-radius: 20px;
    z-index: 2;
}
.status-pill.on  { color: rgb(var(--theme)); background: rgba(var(--theme), 0.12); border: 1px solid rgba(var(--theme), 0.3); }
.status-pill.off { color: var(--text-muted); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }

/* ───────── Inline Bind Badge (F11 universal keybind) ───────── */
.bind-badge {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(var(--theme), 0.25);
    border-radius: 6px;
    padding: 2px 7px;
    margin-right: 8px;
    white-space: nowrap;
    flex-shrink: 0;
    z-index: 2;
}
.menu-item.active .bind-badge { color: #fff; border-color: rgba(var(--theme), 0.55); }
.bind-badge.listening {
    color: rgb(var(--theme));
    border-color: rgb(var(--theme));
    box-shadow: 0 0 12px rgba(var(--theme), 0.5);
    animation: kbPulse 0.9s ease-in-out infinite;
}

/* ───────── Keybind Badge ───────── */
.keybind-badge {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(var(--theme), 0.18);
    border-radius: 6px;
    padding: 3px 8px;
    min-width: 20px;
    text-align: center;
    z-index: 2;
}
.menu-item.active .keybind-badge { color: #fff; border-color: rgba(var(--theme), 0.5); }
.keybind-badge.listening {
    color: rgb(var(--theme));
    border-color: rgb(var(--theme));
    box-shadow: 0 0 12px rgba(var(--theme), 0.5);
    animation: kbPulse 0.9s ease-in-out infinite;
}
@keyframes kbPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

/* ───────── Notification Toasts ───────── */
.toast-stack {
    position: fixed;
    right: 18px;
    bottom: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
    pointer-events: none;
}

.toast {
    min-width: 220px;
    max-width: 340px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    /* Solid bg — no backdrop-filter (renders black in transparent DUI texture) */
    background: linear-gradient(160deg, rgba(24, 18, 32, 0.95) 0%, rgba(12, 9, 16, 0.96) 100%);
    border: 1px solid rgba(var(--theme), 0.18);
    border-left: 3px solid rgb(var(--theme));
    box-shadow: 0 0 30px -8px rgba(var(--theme), 0.4);
    color: var(--text-primary);
    transform: translateX(120%);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}
.toast.show { transform: translateX(0); opacity: 1; }
.toast .toast-icon {
    font-size: 16px;
    color: rgb(var(--theme));
    text-shadow: 0 0 12px rgba(var(--theme), 0.6);
    flex-shrink: 0;
}
.toast .toast-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.toast .toast-title { font-size: 12.5px; font-weight: 700; letter-spacing: 0.3px; }
.toast .toast-text {
    font-size: 11.5px;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.toast.type-success { border-left-color: #2ecc71; }
.toast.type-success .toast-icon { color: #2ecc71; text-shadow: 0 0 12px rgba(46,204,113,0.6); }
.toast.type-error { border-left-color: #e74c3c; }
.toast.type-error .toast-icon { color: #e74c3c; text-shadow: 0 0 12px rgba(231,76,60,0.6); }
.toast.type-warning { border-left-color: #f1c40f; }
.toast.type-warning .toast-icon { color: #f1c40f; text-shadow: 0 0 12px rgba(241,196,15,0.6); }

/* ───────── Subtitle under item name (descriptions) ───────── */
.item-name-wrap { display: flex; flex-direction: column; flex: 1; min-width: 0; z-index: 2; }
.item-name-wrap .item-name { flex: none; }
.item-desc {
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 1px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.3s ease;
}
.menu-item.active .item-desc { color: var(--text-secondary); }

/* ───────── Loader / Keybind Overlay ───────── */
.loader-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    transition: opacity 0.4s ease;
}

.loader-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

.loader-box {
    width: 260px;
    background: rgba(var(--bg), 0.9);
    border: 1px solid rgba(var(--theme), 0.2);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px -10px rgba(var(--theme), 0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: scale(0.95);
    animation: loaderPop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes loaderPop {
    0% { opacity: 0; transform: scale(0.95) translateY(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

.spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(var(--theme), 0.15);
    border-top-color: rgb(var(--theme));
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 18px;
    box-shadow: 0 0 15px rgba(var(--theme), 0.4);
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loader-title {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    text-shadow: 0 0 12px rgba(var(--theme), 0.6);
    letter-spacing: 1px;
}

.loader-text {
    font-size: 12px;
    color: var(--text-secondary);
}

.bind-prompt {
    margin-top: 18px;
    width: 100%;
}

.btn-bind {
    width: 100%;
    background: linear-gradient(100deg, rgba(var(--theme), 0.2) 0%, rgba(var(--theme), 0.05) 100%);
    border: 1px solid rgba(var(--theme), 0.4);
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 15px rgba(var(--theme), 0.2);
}

.btn-bind:hover {
    background: rgba(var(--theme), 0.3);
    box-shadow: 0 0 20px rgba(var(--theme), 0.4);
}

.bind-listen {
    font-size: 12.5px;
    font-weight: 600;
    color: rgb(var(--theme));
    animation: kbPulse 0.9s ease-in-out infinite;
    padding: 10px 0;
}

/* ───────── HUD widgets (each pill is its own draggable layer) ───────── */
.watermark-container {
    display: contents;
}

body.watermark-hidden .watermark-pill {
    display: none !important;
}

.watermark-pill {
    position: fixed;
    z-index: 10000;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 4px;
    margin: 0;

    backdrop-filter: none;

    pointer-events: auto;
    cursor: move;
    user-select: none;
    -webkit-user-select: none;

.watermark-pill.is-dragging {
    cursor: grabbing;
    opacity: 0.92;
}

.watermark-pill .wm-icon {

@keyframes textShine {

        /* ---- Item markup builder (superset of every supported control) ---- */
        function buildItemHtml(item, i) {
            if (item.type === "separator") {
                return '<div class="menu-separator" data-index="' + i + '">' +
                    '<span class="separator-line"></span>' +
                    '<span class="separator-text">' + esc(item.label) + '</span>' +
                    '<span class="separator-line"></span>' +
                    '</div>';
            }

            var right = "";
            switch (item.type) {
                case "submenu":
                    right = '<span class="item-arrow" aria-hidden="true">&gt;</span>';
                    break;
                case "toggle":
                    right = '<div class="toggle-switch ' + (item.value ? "on" : "") + '"><div class="toggle-knob"></div></div>';
                    break;
                case "slider": {
                    var span = (item.max - item.min) || 1;
                    var pct = ((item.value - item.min) / span) * 100;
                    right = '<div class="slider-container">' +
                        '<div class="slider-track"><div class="slider-fill" style="width:' + pct + '%"></div></div>' +
                        '<span class="slider-value">' + esc(item.value) + esc(item.unit || "") + '</span>' +
                        '</div>';
                    break;
                }
                case "action":
                    right = '<span class="item-arrow item-arrow--dim" aria-hidden="true">&gt;</span>';
                    break;
                case "array": {
                    var label = (item.options && item.options[item.value] != null)
                        ? item.options[item.value] : "";
                    right = '<div class="array-container">' +
                        '<span class="array-arrow left-arrow">‹</span>' +
                        '<span class="array-value">' + esc(label) + '</span>' +
                        '<span class="array-arrow right-arrow">›</span>' +
                        '</div>';
                    break;
                }
                case "value":
                    right = '<div class="array-container">' +
                        '<span class="array-arrow left-arrow">‹</span>' +
                        '<span class="array-value">' + esc(item.valueStr) + '</span>' +
                        '<span class="array-arrow right-arrow">›</span>' +
                        '</div>';
                    break;
                case "color":
                    right = '<div class="color-preview" style="background-color:' + esc(item.value) + '"></div>';
                    break;
                case "info":
                    right = '<span class="info-value">' + esc(item.valueStr) + '</span>';
                    break;
                case "keybind":
                    right = '<span class="keybind-badge' + (item.listening ? " listening" : "") + '">' +
                        esc(item.listening ? "..." : (item.keyStr || "—")) + '</span>';
                    break;
            }

            var iconHtml = (item.type === "submenu" && item.icon)
                ? '<span class="item-icon">' + getIconSvg(item.icon) + '</span>' : "";

            var nameHtml;
            if (item.desc) {
                nameHtml = '<span class="item-name-wrap">' +
                    '<span class="item-name">' + esc(item.label) + '</span>' +
                    '<span class="item-desc">' + esc(item.desc) + '</span>' +
                    '</span>';
            } else {
                nameHtml = '<span class="item-name">' + esc(item.label) + '</span>';
            }

            // Optional keybind badge (shown when a feature is bound, or while
            // listening for a key after F11). Appears just left of the control.
            var bindHtml = "";
            if (item.listening) {
                bindHtml = '<span class="bind-badge listening">[ press key ]</span>';
            } else if (item.bind || item.keyStr) {
                bindHtml = '<span class="bind-badge">' + esc(item.bind || item.keyStr) + '</span>';
            }

            var cls = "menu-item" + (item.type === "info" ? " is-info" : "");
            return '<div class="' + cls + '" data-index="' + i + '">' +
                   iconHtml + nameHtml + bindHtml + right + '</div>';
        }

        function getScrollLerp() {

            if (itemBottom > viewBottom - pad) return Math.min(maxScroll, itemBottom - viewH + pad);

            dom.selector.style.height = node.offsetHeight + "px";
            dom.selector.style.top = selectorTopForNode(node) + "px";
            dom.selector.style.opacity = "1";
        }

        function hideSelector() {
            if (!dom.selector) return;
            dom.selector.style.transition = "none";
            dom.selector.style.opacity = "0";
            dom.selector.style.visibility = "hidden";
        }

        function render(items, activeIdx, animateDir, onReady) {
            bindListScrollSync();
            currentItems = items || [];
            var html = "";
            for (var i = 0; i < currentItems.length; i++) html += buildItemHtml(currentItems[i], i);

            var commit = function (holdSelector) {
                stopScrollLoop();
                hideSelector();
                dom.list.innerHTML = html;
                dom.list.scrollTop = 0;
                setActive(activeIdx, true, true, !!holdSelector);
                adjustHeight();
                if (onReady) onReady();
            };

            if (animateDir && dom.viewport) {
                transitioning = true;
                hideSelector();
                var fwd = animateDir === "forward";
                dom.viewport.classList.remove(
                    "page-out-forward", "page-out-backward",
                    "page-in-forward", "page-in-backward"
                );
                dom.viewport.style.opacity = "";
                dom.viewport.style.transform = "";
                dom.viewport.style.filter = "";
                dom.viewport.classList.add(fwd ? "page-out-forward" : "page-out-backward");
                setTimeout(function () {
                    commit(true);
                    dom.viewport.classList.remove("page-out-forward", "page-out-backward");
                    void dom.viewport.offsetWidth;
                    dom.viewport.classList.add(fwd ? "page-in-forward" : "page-in-backward");
                    requestAnimationFrame(function () {
                        requestAnimationFrame(function () {
                            syncSelectorToActive(true);
                        });
                    });
                    setTimeout(function () {
                        dom.viewport.classList.remove("page-in-forward", "page-in-backward");
                        dom.viewport.style.opacity = "";
                        dom.viewport.style.transform = "";
                        dom.viewport.style.filter = "";
                        syncSelectorToActive(false);
                        transitioning = false;
                    }, PAGE_IN_MS);
                }, PAGE_OUT_MS);
            } else {
                if (dom.viewport) {
                    dom.viewport.classList.remove(
                        "page-out-forward", "page-out-backward",
                        "page-in-forward", "page-in-backward"
                    );
                    dom.viewport.style.opacity = "";
                    dom.viewport.style.transform = "";
                    dom.viewport.style.filter = "";
                }
                commit(false);
            }
        }

        function setActive(index, instantScroll, instantSelector, holdSelector) {
            var nodes = dom.list ? dom.list.children : [];
            var activeNode = null;
            for (var i = 0; i < nodes.length; i++) {
                if (!nodes[i].classList.contains("menu-item")) continue;
                var idx = parseInt(nodes[i].getAttribute("data-index"), 10);
                if (idx === index) {
                    nodes[i].classList.add("active");
                    activeNode = nodes[i];
                } else {
                    nodes[i].classList.remove("active");
                }
            }
            activeIndex = index;
            if (!activeNode) {
                hideSelector();
                updatePageCount();
                updateScrollbar();
                return;

            if (!holdSelector) {

        function nodeForItemIndex(index) {
            if (!dom.list) return null;

            if (node) return node;

        function refreshBindBadge(node, item) {
            if (!node || !item) return;
            if (item.type !== "toggle" && item.type !== "action") return;

            var label = item.listening ? null : (item.bind || item.keyStr || null);
            if (label === "" || label === false) label = null;
            var existing = node.querySelector(".bind-badge");

            if (item.listening) {
                if (!existing) {
                    existing = document.createElement("span");
                    var ctrl = node.querySelector(".toggle-switch, .item-arrow");
                    node.insertBefore(existing, ctrl || null);
                }
                existing.textContent = "[ press key ]";
                existing.className = "bind-badge listening";
                return;
            }

            if (label) {
                if (!existing) {
                    existing = document.createElement("span");
                    var ctrl2 = node.querySelector(".toggle-switch, .item-arrow");
                    node.insertBefore(existing, ctrl2 || null);
                }
                existing.textContent = label;
                existing.className = "bind-badge";
            } else if (existing) {
                existing.parentNode.removeChild(existing);
            }

        /* Patch a single item's control in place (no full re-render) */
        function updateItem(index, patch) {
            var item = currentItems[index];
            var node = nodeForItemIndex(index);
            if (!item || !node) return;
            for (var k in patch) if (patch.hasOwnProperty(k)) item[k] = patch[k];

            if (item.type === "toggle") {
                if (patch.hasOwnProperty("value")) item.value = !!patch.value;
                var sw = node.querySelector(".toggle-switch");
                if (sw) {
                    sw.classList.toggle("on", !!item.value);
                }
            } else if (item.type === "slider") {
                var span = (item.max - item.min) || 1;
                var pct = ((item.value - item.min) / span) * 100;
                var fill = node.querySelector(".slider-fill");
                var val = node.querySelector(".slider-value");
                if (fill) fill.style.width = pct + "%";
                if (val) val.textContent = item.value + (item.unit || "");
            } else if (item.type === "array") {
                var av = node.querySelector(".array-value");
                if (av && item.options) av.textContent = item.options[item.value] != null ? item.options[item.value] : "";
            } else if (item.type === "value") {
                var vv = node.querySelector(".array-value");
                if (vv) vv.textContent = item.valueStr;
            } else if (item.type === "color") {
                var sw2 = node.querySelector(".color-preview");
                if (sw2) sw2.style.backgroundColor = item.value;
            } else if (item.type === "info") {
                var iv = node.querySelector(".info-value");
                if (iv) iv.textContent = item.valueStr;
            } else if (item.type === "keybind") {
                var kb = node.querySelector(".keybind-badge");
                if (kb) {
                    kb.classList.toggle("listening", !!item.listening);
                    kb.textContent = item.listening ? "..." : (item.keyStr || "—");
                }

            if (patch.hasOwnProperty("listening")) item.listening = !!patch.listening;
            if (patch.hasOwnProperty("bind")) item.bind = patch.bind || null;
            if (patch.hasOwnProperty("keyStr")) item.keyStr = patch.keyStr || null;

        function setBindBadge(index, label, listening) {
            var item = currentItems[index];
            var node = nodeForItemIndex(index);
            if (!item || !node) return;
            item.listening = !!listening;
            if (label && label !== "") {
                item.bind = label;
                item.keyStr = label;
            } else {
                item.bind = null;
                item.keyStr = null;

        function pressFeedback(index) {

        function measureListContentHeight() {
            if (!dom.list) return MENU_MIN_HEIGHT;

                    dom.thumb.style.top = "0px";
                    if (dom.arrowTop) dom.arrowTop.style.display = "none";
                    if (dom.arrowBottom) dom.arrowBottom.style.display = "none";
                    return;
                }
                if (dom.arrowTop) dom.arrowTop.style.display = "";
                if (dom.arrowBottom) dom.arrowBottom.style.display = "";

                dom.thumb.style.height = th + "px";

        function renderTabs(tabs, activeId, onClick) {

                    '" data-tab="' + esc(tabs[i].id) + '">' + esc(tabs[i].label) + '</div>';
            }
            dom.tabs.innerHTML = html;
            if (onClick) {
                var els = dom.tabs.querySelectorAll(".tab");
                for (var j = 0; j < els.length; j++) {

                    })(els[j].getAttribute("data-tab"));
                }

        }

        /* ---- Header identity ---- */
        function setHeader(data) {
            if (data.name != null && dom.biName) dom.biName.textContent = data.name;
            if (data.sub != null && dom.biSub) dom.biSub.textContent = data.sub;
            if (data.avatar && dom.biAvatar) dom.biAvatar.src = data.avatar;
        }

        /* ---- Visibility ---- */
        function setVisible(visible) {

            document.body.classList.toggle("menu-open", !!visible);
        }

        /* ---- Screen position (Lua position sliders, % of viewport) ---- */
        function setPosition(x, y) {
            if (!dom.container) return;
            /* In DUI mode the whole browser IS the menu panel — position comes from DrawSprite */
            if (document.body.classList.contains("dui-mode")) {
                dom.container.style.left = "0";
                dom.container.style.top = "0";
                dom.container.style.right = "auto";
                dom.container.style.bottom = "auto";
                return;
            }
            var px = Math.max(0, Math.min(95, Number(x) || 0));
            var py = Math.max(0, Math.min(95, Number(y) || 0));
            dom.container.style.left = px + "vw";
            dom.container.style.top = py + "vh";
            dom.container.style.right = "auto";
            dom.container.style.bottom = "auto";
        }

        /* ---- Menu scale (Lua size selector). Uses CSS zoom: in CEF/Chromium
               it scales the whole panel without clashing with the transform-based
               open/close animation. ---- */
        function setScale(scale) {
            if (!dom.container) return;
            /* In-game DUI: Lua DrawSprite handles size — CSS scale blurs the texture */
            if (document.body.classList.contains("dui-mode")) {
                dom.container.style.zoom = "";
                dom.container.style.transform = "";
                return;
            }
            var s = Number(scale);
            if (!s || s <= 0) s = 1;
            s = Math.max(0.6, Math.min(1.6, s));
            dom.container.style.zoom = "";
            dom.container.style.transform = "scale(" + s + ")";
            dom.container.style.transformOrigin = "top left";
        }

        function setWatermarkVisible(visible) {
            document.body.classList.toggle("watermark-hidden", !visible);
        }

        /* ---- Toast notifications ---- */
        function notify(opts) {
            if (!dom.toastStack) return;
            opts = opts || {};
            var kind = opts.kind || "info";
            var icons = { info: "ℹ", success: "✓", error: "✕", warning: "!" };
            var el = document.createElement("div");
            el.className = "toast type-" + kind;
            el.innerHTML =
                '<span class="toast-icon">' + (icons[kind] || icons.info) + '</span>' +
                '<div class="toast-body">' +
                '<span class="toast-title">' + esc(opts.title || "Solaris") + '</span>' +
                (opts.text ? '<span class="toast-text">' + esc(opts.text) + '</span>' : "") +
                '</div>';
            dom.toastStack.appendChild(el);
            requestAnimationFrame(function () { el.classList.add("show"); });
            var dur = opts.duration || 3200;
            setTimeout(function () {
                el.classList.remove("show");
                setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 450);
            }, dur);
        }

        function isTransitioning() { return transitioning; }
        function items() { return currentItems; }
        function getActive() { return activeIndex; }

        return {
            render: render, setActive: setActive, updateItem: updateItem,
            setBindBadge: setBindBadge, refreshBindBadge: refreshBindBadge,
            pressFeedback: pressFeedback, flashArrow: flashArrow,

    /* ============================================================================
     *  BRIDGE — receives commands from the Lua core (DUI messages)
     * ==========================================================================*/
    var driven = false;

    function handleMessage(msg) {
        if (!msg || typeof msg.type !== "string" || msg.type.indexOf("solaris:") !== 0) return;
        driven = true;
        document.body.classList.remove("standalone");

        switch (msg.type) {
            case "solaris:ping":
                if (dom.biSub) dom.biSub.textContent = "Lua connected";
                if (dom.pageCount) dom.pageCount.textContent = "↑↓ · Enter · ←";
                break;
            case "solaris:init":
                document.documentElement.classList.add("dui-mode");
                document.body.classList.add("dui-mode");
                if (msg.theme) Theme.set(msg.theme[0], msg.theme[1], msg.theme[2]);
                if (dom.biName && msg.brand) dom.biName.textContent = msg.brand;
                if (dom.biSub) {
                    dom.biSub.textContent = msg.version
                        ? ("v" + msg.version + " — connected")
                        : "connected";
                }
                break;
            case "solaris:setVisible":
                View.setVisible(!!msg.visible);
                break;
            case "solaris:setHeader":
                View.setHeader(msg);
                break;
            case "solaris:setTabs":
                View.renderTabs(msg.tabs || [], msg.activeTab, function (id) {
                    postToLua({ action: "tabClick", tab: id });
                });
                break;
            case "solaris:setPage":
                View.setVisible(true);
                View.render(msg.items || [], msg.activeIndex != null ? msg.activeIndex : 0, msg.animateDir || null);
                break;
            case "solaris:setActive":
                View.setVisible(true);
                View.setActive(msg.index != null ? msg.index : 0, false, false);
                break;
            case "solaris:updateItem":
                View.updateItem(msg.index, msg.patch || {});
                break;
            case "solaris:setBindBadge":
                View.setBindBadge(
                    msg.index != null ? msg.index : 0,
                    msg.bind || msg.keyStr || null,
                    !!msg.listening
                );
                break;
            case "solaris:setTheme":
                if (msg.rainbow === true) Theme.startRainbow();
                else if (msg.rainbow === false) { Theme.stopRainbow(); if (msg.r != null) Theme.set(msg.r, msg.g, msg.b); }
                else Theme.set(msg.r, msg.g, msg.b);
                break;
            case "solaris:setPosition":
                View.setPosition(msg.x, msg.y);
                break;
            case "solaris:setScale":
                View.setScale(msg.scale);
                break;
            case "solaris:setWatermark":
                View.setWatermarkVisible(msg.visible !== false);
                break;
            case "solaris:setHudStats":
                if (msg.fps != null) {
                    var fpsEl = document.getElementById("wm-fps-text");
                    if (fpsEl) fpsEl.textContent = String(msg.fps);
                }
                if (msg.ping != null) {
                    var pingEl = document.getElementById("wm-ping-text");
                    if (pingEl) pingEl.textContent = String(msg.ping);
                }
                if (msg.user != null) {
                    var userEl = document.getElementById("wm-user-text");
                    if (userEl) userEl.textContent = String(msg.user);
                }
                if (msg.release != null) {
                    var relEl = document.getElementById("wm-release-text");
                    if (relEl) relEl.textContent = String(msg.release);
                }
                break;
            case "solaris:setScrollMode":
                View.setScrollMode(msg.mode != null ? msg.mode : 2);
                break;
            case "solaris:notify":
                View.notify(msg);
                break;
            case "solaris:pressFeedback":
                View.pressFeedback(msg.index);
                break;
            case "solaris:flashArrow":
                View.flashArrow(msg.index, msg.dir);
                break;
            case "solaris:setKeybindState": {
                var nodes = dom.list ? dom.list.children : [];
                var idx = msg.index;
                if (nodes[idx]) {
                    var kbVal = nodes[idx].querySelector(".keybind-value, .array-value");
                    if (kbVal) kbVal.textContent = msg.listening ? "[ Press a key... ]" : (kbVal.dataset.key || kbVal.textContent);
                    nodes[idx].classList.toggle("keybind-listening", !!msg.listening);
                }
                break;
            }
        }
    }

    /* Optional JS -> Lua channel. Only works if the executor exposes a NUI
       callback endpoint; harmless no-op otherwise. Lua never depends on it. */
    function postToLua(payload) {
        try {
            if (window.invokeNative && window.GetParentResourceName) {
                fetch("https://" + window.GetParentResourceName() + "/solaris", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=UTF-8" },
                    body: JSON.stringify(payload)
                }).catch(function () {});
            }
        } catch (e) { /* ignore */ }
    }

    function parseDuiPayload(data) {
        if (data == null) return null;
        if (typeof data === "string") {

        }

    }

    function unwrapMessage(raw) {
        var msg = parseDuiPayload(raw);
        if (msg) return msg;
        if (raw && typeof raw === "object") {
            msg = parseDuiPayload(raw.data);
            if (msg) return msg;
            msg = parseDuiPayload(raw.message);
            if (msg) return msg;
            msg = parseDuiPayload(raw.payload);
            if (msg) return msg;
        }
        return null;
    }

    window.addEventListener("message", function (event) {
        var msg = unwrapMessage(event.data);
        if (msg && msg.type === "solaris:setPage" && msg.items && msg.items.length) {

            document.body.classList.remove("standalone");

    });

    window.handleDuiMessage = function (raw) {
        handleMessage(unwrapMessage(raw));
    };

                if (idx < 0) idx = items.length - 1;
                else if (idx >= items.length) idx = 0;
                if (++loops > items.length) break;
            } while (items[idx] && items[idx].type === "separator");
            indexHistory[indexHistory.length - 1] = idx;
            View.setActive(idx);
            setTimeout(function () { cooldown = false; }, 110);
        }

        function enter() {
            if (View.isTransitioning()) return;
            var item = curItems()[curIdx()];
            if (!item) return;
            var idx = curIdx();
            if (item.type === "submenu" && pages[item.target]) {
                View.pressFeedback(idx);
                navHistory.push(item.target);
                indexHistory.push(0);
                show("forward");
            } else if (item.type === "toggle") {
                item.value = !item.value;
                View.updateItem(idx, { value: item.value });
                View.pressFeedback(idx);
                if (item.isRainbow) { if (item.value) Theme.startRainbow(); else { Theme.stopRainbow(); Theme.set(181, 0, 0); } }
            } else if (item.type === "action") {
                View.pressFeedback(idx);
                View.notify({ title: item.label, text: "Action triggered (preview)", kind: "success" });
            } else if (item.type === "color" && item.isTheme) {
                openColor(item, idx);
            }
        }

        function openColor(item, idx) {
            var input = document.createElement("input");
            input.type = "color"; input.value = item.value;
            input.style.cssText = "position:absolute;opacity:0;pointer-events:none";
            document.body.appendChild(input);
            input.click();
            input.addEventListener("input", function (e) {
                item.value = e.target.value;
                View.updateItem(idx, { value: e.target.value });
                var rgb = Theme.hexToRgb(e.target.value);
                Theme.set(rgb[0], rgb[1], rgb[2]);
            });
            input.addEventListener("change", function () { document.body.removeChild(input); });
        }

        function back() {
            if (navHistory.length > 1 && !View.isTransitioning()) {
                navHistory.pop(); indexHistory.pop();
                show("backward");
            }
        }

        function leftRight(dir) {
            if (View.isTransitioning()) return;
            var item = curItems()[curIdx()];
            if (!item) return;
            var idx = curIdx();
            if (item.type === "slider") {
                var step = (item.max - item.min) <= 20 ? 1 : Math.max(1, Math.round((item.max - item.min) / 50));
                item.value = dir === "left"
                    ? Math.max(item.min, item.value - step)
                    : Math.min(item.max, item.value + step);
                View.updateItem(idx, { value: item.value });
            } else if (item.type === "array") {
                item.value = dir === "left"
                    ? (item.value > 0 ? item.value - 1 : item.options.length - 1)
                    : (item.value < item.options.length - 1 ? item.value + 1 : 0);
                View.updateItem(idx, { value: item.value });
                View.flashArrow(idx, dir);
            } else if (dir === "left") back();
            else if (dir === "right" && item.type === "submenu") enter();
        }

        function start() {
            document.body.classList.add("standalone");
            View.renderTabs(
                [{ id: "main", label: "Main" }, { id: "bypasses", label: "Bypasses" }, { id: "settings", label: "Settings" }],
                "main",
                function () { /* preview tabs are inert */ }
            );
            View.setHeader({ name: "Solaris", sub: "browser preview", avatar: "https://cdn.discordapp.com/embed/avatars/0.png" });
            show();

            document.addEventListener("keydown", function (e) {
                if (driven) return; /* Lua took over */
                if (e.key === "ArrowUp") { e.preventDefault(); navigate(-1); }
                else if (e.key === "ArrowDown") { e.preventDefault(); navigate(1); }
                else if (e.key === "ArrowLeft") { e.preventDefault(); leftRight("left"); }
                else if (e.key === "ArrowRight") { e.preventDefault(); leftRight("right"); }
                else if (e.key === "Enter") { e.preventDefault(); if (!e.repeat) enter(); }
                else if (e.key === "Backspace") { e.preventDefault(); back(); }
            });
        }

        function getPages() { return pages; }
        return { start: start, getPages: getPages };
    })();

    /* ───────────────────────── Initial Loader Sequence ───────────────────────── */
    var Loader = (function() {
        var overlay = document.getElementById("loader-overlay");
        var spinner = document.getElementById("loader-spinner");
        var text = document.getElementById("loader-text");
        var prompt = document.getElementById("bind-prompt");
        var btnBind = document.getElementById("btn-bind");
        var bindListen = document.getElementById("bind-listen");
        var selectedKey = null;

        function run(onComplete) {
            if (!overlay) return onComplete();

            overlay.classList.remove("hidden");
            // Hide the main menu while loading
            View.setVisible(false);

            setTimeout(function() { text.textContent = "Loading Assets..."; }, 500);
            setTimeout(function() { text.textContent = "Authenticating..."; }, 1000);

            setTimeout(function() {
                spinner.style.display = "none";
                text.style.display = "none";
                prompt.style.display = "block";

                btnBind.addEventListener("click", function() {
                    btnBind.style.display = "none";
                    bindListen.style.display = "block";
                    
                    var keyHandler = function(e) {
                        e.preventDefault();
                        selectedKey = e.key.toUpperCase();
                        if (selectedKey === " ") selectedKey = "SPACE";
                        
                        document.removeEventListener("keydown", keyHandler);
                        
                        bindListen.textContent = "Keybind Set to: " + selectedKey;
                        bindListen.style.animation = "none";
                        bindListen.style.color = "#2ecc71";
                        
                        setTimeout(function() {
                            overlay.classList.add("hidden");
                            View.setVisible(true);
                            if (onComplete) onComplete(selectedKey);
                        }, 700);
                    };
                    
                    document.addEventListener("keydown", keyHandler);
                });
            }, 1500);
        }

        return { run: run };
    })();

    /* ───────────────────────── Boot ───────────────────────── */
    function isInGameDuiHost() {
        try {
            if (typeof window.invokeNative === "function") return true;
            var ua = navigator.userAgent || "";
            if (ua.indexOf("CitizenFX") !== -1) return true;
        } catch (e) { /* ignore */ }
        return false;
    }

    function wmStorageKey(id) {
        return "solaris_wm_pos_" + id;
    }

    function saveWidgetPosition(el, id) {
        if (!el || !id) return;
        try {
            var rect = el.getBoundingClientRect();
            localStorage.setItem(wmStorageKey(id), JSON.stringify({
                left: Math.round(rect.left),
                top: Math.round(rect.top)
            }));
        } catch (e) { /* ignore */ }
    }

    function applyWidgetPosition(el, pos) {
        if (!el || !pos) return;
        el.style.position = "fixed";
        el.style.right = "auto";
        el.style.bottom = "auto";
        el.style.margin = "0";
        el.style.left = (pos.left != null ? pos.left : 16) + "px";
        el.style.top = (pos.top != null ? pos.top : 16) + "px";
    }

    function makeDraggable(el, id) {
        if (!el || !id) return;
        var isDragging = false;
        var startX, startY, initialX, initialY;

        el.addEventListener("mousedown", function(e) {
            if (e.button !== 0) return;
            isDragging = true;
            el.classList.add("is-dragging");
            startX = e.clientX;
            startY = e.clientY;
            var rect = el.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;
            el.style.position = "fixed";
            el.style.zIndex = "10001";
            el.style.right = "auto";
            el.style.bottom = "auto";
            el.style.left = initialX + "px";
            el.style.top = initialY + "px";
            e.preventDefault();
        });

        document.addEventListener("mousemove", function(e) {
            if (!isDragging) return;
            el.style.left = (initialX + (e.clientX - startX)) + "px";
            el.style.top = (initialY + (e.clientY - startY)) + "px";
        });

        document.addEventListener("mouseup", function() {
            if (!isDragging) return;
            isDragging = false;
            el.classList.remove("is-dragging");
            saveWidgetPosition(el, id);
        });
    }

    function initWatermarkWidgets() {
        var defaults = {
            hotkeys: { left: 24, top: 18 },
            brand:   { left: 130, top: 18 },
            user:    { left: 230, top: 18 },
            release: { left: 360, top: 18 },
            fps:     { left: 500, top: 18 },
            ping:    { left: 610, top: 18 }
        };
        var pills = document.querySelectorAll(".watermark-pill");
        for (var i = 0; i < pills.length; i++) {
            var pill = pills[i];
            var id = pill.getAttribute("data-wm") || ("wm" + i);
            var saved = null;
            try {
                var raw = localStorage.getItem(wmStorageKey(id));
                if (raw) saved = JSON.parse(raw);
            } catch (e) { /* ignore */ }
            applyWidgetPosition(pill, saved || defaults[id] || { left: 24 + i * 96, top: 18 });
            makeDraggable(pill, id);
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        cacheDom();
        dom.list.addEventListener("scroll", function () { View.updateScrollbar(); });

        initWatermarkWidgets();

        /* Normal browser / file = preview UI. FiveM CitizenFX = in-game DUI (transparent). */
        var forcePreview = /[?&]preview=1\b/.test(window.location.search)
            || /[?&]standalone=1\b/.test(window.location.search);
        var inGame = isInGameDuiHost();
        var isPreviewMode = forcePreview || !inGame;

        if (!isPreviewMode) {
            document.documentElement.classList.add("dui-mode");
            document.body.classList.add("dui-mode");
            var overlay = document.getElementById("loader-overlay");
            if (overlay) overlay.classList.add("hidden");
            /* Default menu so in-game is never an empty box before Lua sync */
            var defaultMain = [
                { label: "Self Options", type: "submenu", target: "self" },
                { label: "Combat Options", type: "submenu", target: "combat" },
                { label: "Weapon Options", type: "submenu", target: "weaponry" },
                { label: "Vehicle Options", type: "submenu", target: "vehicles" },
                { label: "Online Options", type: "submenu", target: "players" },
                { label: "World Options", type: "submenu", target: "server" },
                { label: "Misc Options", type: "submenu", target: "assists" }
            ];
            View.renderTabs(
                [
                    { id: "main", label: "MAIN" },
                    { id: "bypasses", label: "BYPASSES" },
                    { id: "settings", label: "SETTINGS" }
                ],
                "main",
                function () { /* keyboard tabs in Lua */ }
            );
            View.render(defaultMain, 0, null);
            View.setVisible(false);
            if (dom.pageCount) dom.pageCount.textContent = "↑↓ · Enter · ←";
            return;
        }

        document.body.classList.add("standalone");

        function startPreview() {
            if (driven) return;
            if (window.location.protocol === "file:") {
                Standalone.start();
                return;
            }
            Loader.run(function (key) {
                if (key) {
                    var settingsPage = Standalone.getPages().settings;
                    if (settingsPage && settingsPage[0] && settingsPage[0].type === "keybind") {
                        settingsPage[0].keyStr = key;
                    }
                }
                Standalone.start();
            });
        }

        setTimeout(startPreview, window.location.protocol === "file:" ? 0 : 250);
    });

    /* Expose the view so the Lua bridge (or console) can poke it if needed. */
    window.Solaris = { handleMessage: handleMessage, handleDuiMessage: window.handleDuiMessage, View: View, Theme: Theme };
})();

</script>
