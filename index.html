<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --accent: #00b585; /* Solaris Teal */
    --accent-rgb: 0, 181, 133;
    --accent-bright: #00e0a5;
    --bg-main: rgba(8, 8, 10, 0.96);
    --bg-sidebar: rgba(12, 12, 15, 0.9);
    --bg-tile: rgba(22, 22, 28, 0.6);
    --bg-hover: rgba(255, 149, 0, 0.04);
    --text-high: #ffffff;
    --text-mid: #94a3b8;
    --text-low: #475569;
    --font-ui: 'Inter', sans-serif;
    --font-logo: 'Outfit', sans-serif;
    --border: 1px solid rgba(255, 255, 255, 0.04);
    --radius: 8px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: var(--font-ui);
    user-select: none;
    -webkit-user-drag: none;
}

::-webkit-scrollbar { display: none; }
* { -ms-overflow-style: none; scrollbar-width: none; }

body {
    background-color: transparent;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 0% 0%, rgba(var(--accent-rgb), 0.05), transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(var(--accent-rgb), 0.04), transparent 45%),
                transparent;
    z-index: -1;
}

.menu-wrapper {
    width: 960px;
    height: 660px;
    background: var(--bg-main);
    border: var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 60px 120px -30px rgba(0, 0, 0, 1),
                0 0 60px rgba(0, 0, 0, 0.6);
    display: flex;
    animation: menuAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    will-change: transform;
    cursor: default;
    pointer-events: auto;
    z-index: 10;
}

.menu-wrapper.sol-dragging {
    cursor: grabbing;
    user-select: none;
}

@keyframes menuAppear {
    from { opacity: 0; transform: scale(0.97) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.menu-container {
    display: flex;
    width: 100%;
    height: 100%;
}

/* --- SIDEBAR --- */
.sidebar {
    width: 200px;
    min-width: 200px;
    background: var(--bg-sidebar);
    border-right: var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 0;
}

.sidebar-brand {
    padding: 0 26px;
    margin-bottom: 35px;
    font-family: var(--font-logo);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
}

.brand-main {
    background: linear-gradient(135deg, #fff 0%, #aaa 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-sub {
    color: var(--accent);
    margin-left: 1px;
    text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.6),
                 0 0 40px rgba(var(--accent-rgb), 0.2);
}

.sidebar-nav {
    flex-grow: 1;
    overflow-y: auto;
    position: relative;
    padding-bottom: 20px;
    display: flex;
    flex-direction: column;
}

.nav-section { margin-bottom: 18px; }

.nav-section-title {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    color: var(--text-low);
    padding: 0 26px;
    margin-bottom: 8px;
    letter-spacing: 1.5px;
    opacity: 0.6;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 26px;
    height: 38px;
    color: var(--text-mid);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 600;
    transition: color 0.3s ease, background 0.3s ease;
    position: relative;
    cursor: pointer;
}

.nav-item i {
    width: 18px;
    text-align: center;
    font-size: 14px;
    opacity: 0.6;
    transition: color 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
}

.nav-item:hover { color: var(--text-high); }
.nav-item:hover i { transform: scale(1.1); }

.nav-item.active {
    color: var(--text-high);
    background: rgba(var(--accent-rgb), 0.08);
}

.sidebar-indicator {
    position: absolute;
    left: 0;
    width: 2px;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(var(--accent-rgb), 0.6),
                0 0 20px rgba(var(--accent-rgb), 0.2);
    transition: top 0.35s cubic-bezier(0.16, 1, 0.3, 1), height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 5;
}

.nav-item.active i {
    color: var(--accent);
    opacity: 1;
    text-shadow: 0 0 10px rgba(var(--accent-rgb), 0.4);
}

.nav-spacer { flex: 1; }

/* --- MAIN CONTENT --- */
.main-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: radial-gradient(circle at top right, rgba(var(--accent-rgb), 0.02), transparent 50%);
}

/* --- TOP BAR: sub-tabs + search --- */
.top-bar {
    display: flex;
    align-items: center;
    padding: 14px 28px;
    border-bottom: var(--border);
    flex-shrink: 0;
    gap: 10px;
}

.sub-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
}

.sub-tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-mid);
    cursor: pointer;
    border-radius: 6px;
    transition: color 0.25s ease, background 0.25s ease;
}

.sub-tab i { font-size: 12px; opacity: 0.6; }

.sub-tab:hover { color: var(--text-high); background: rgba(255,255,255,0.03); }

.sub-tab.active {
    color: var(--text-high);
    background: rgba(var(--accent-rgb), 0.1);
}

.sub-tab.active i { color: var(--accent); opacity: 1; }

.search-box {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 8px;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 200px;
    transition: all 0.3s;
    flex-shrink: 0;
}

.search-box:focus-within {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(var(--accent-rgb), 0.3);
}

.search-box i { font-size: 13px; color: var(--text-low); }

.search-box input {
    background: none;
    border: none;
    color: var(--text-high);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    width: 100%;
}

/* --- CONTENT GRID --- */
.content-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    align-content: flex-start;
    overflow-y: auto;
    overflow-x: hidden;
    flex: 1;
    padding: 20px 28px;
}

/* --- Tab transition --- */
.content-grid.grid-exit {
    animation: gridFadeOut 0.12s ease forwards;
    pointer-events: none;
}

.content-grid.grid-enter {
    animation: gridFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes gridFadeOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes gridFadeIn { from { opacity: 0; } to { opacity: 1; } }

/* --- Tile animations --- */
.tile-entry-anim {
    opacity: 0;
    animation: tileSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes tileSlideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}

.item-entry-anim {
    opacity: 0;
    animation: itemReveal 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes itemReveal {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* --- TILE --- */
.tile {
    background: rgba(14, 14, 17, 0.7);
    border: var(--border);
    border-radius: var(--radius);
    padding: 16px;
    height: fit-content;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.tile-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-high);
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    padding-bottom: 9px;
    margin-bottom: 3px;
}

.tile-icon { color: var(--accent); font-size: 13px; }

.tile-items {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* --- FUNCTION ITEM --- */
.function-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 0;
    cursor: pointer;
    min-height: 24px;
}

.function-label {
    font-size: 13px;
    color: var(--text-mid);
    font-weight: 500;
    transition: all 0.3s ease;
}

.function-item.toggled-on .function-label {
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
}

.function-item:hover .function-label { color: #fff; }

/* Action items (centered text) */
.function-item.action-item {
    justify-content: center;
}
.function-item.action-item .function-label {
    text-align: center;
}

/* Info items (non-interactive, centered) */
.function-item.info-item {
    justify-content: center;
    cursor: default;
}
.function-item.info-item .function-label {
    color: var(--text-low);
    text-align: center;
    font-size: 12.5px;
}

/* Text input items */
.text-input-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
}
.text-input-wrap label {
    font-size: 12px;
    color: var(--text-low);
    font-weight: 500;
}
.text-input-wrap input[type="text"] {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 5px;
    padding: 6px 10px;
    color: var(--text-mid);
    font-size: 12.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
}
.text-input-wrap input[type="text"]:focus {
    border-color: rgba(var(--accent-rgb), 0.3);
    color: var(--text-high);
}
.text-input-wrap input[type="text"]::placeholder {
    color: var(--text-low);
    opacity: 0.6;
}

/* Option dropdown-style item */
.option-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 0;
    min-height: 24px;
}
.option-label {
    font-size: 12px;
    color: var(--text-low);
    font-weight: 500;
}
.option-value {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text-mid);
}
.option-value i { font-size: 10px; color: var(--text-low); }

/* --- Custom Canvas Color Picker --- */
.custom-color-picker-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px 0;
    width: 100%;
    max-height: 200px;
    overflow: hidden;
    transition: max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.3s ease,
                padding 0.3s ease;
    opacity: 1;
    outline: none;
}
.custom-color-picker-wrap.collapsed {
    max-height: 0;
    opacity: 0;
    padding: 0;
    gap: 0;
}
.color-picker-canvas {
    width: 100%;
    height: 120px;
    position: relative;
    border-radius: 6px;
    cursor: crosshair;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    border: none;
    outline: none;
}
.canvas-white-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, #fff, transparent);
}
.canvas-black-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, transparent, #000);
}
.color-picker-handle {
    position: absolute;
    width: 12px;
    height: 12px;
    border: 2px solid #fff;
    border-radius: 50%;
    transform: translate(-6px, -6px);
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    left: 100%;
    top: 0%;
}
.hue-slider-container {
    width: 100%;
    height: 10px;
    position: relative;
    border-radius: 50px;
    cursor: pointer;
    overflow: visible;
    background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
}
.hue-slider-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid #fff;
    background: #fff;
    border-radius: 50%;
    top: -2px;
    transform: translateX(-7px);
    box-shadow: 0 0 6px rgba(0,0,0,0.5);
    pointer-events: none;
}

/* --- Accent Choose Color Row --- */
.accent-choose-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    cursor: pointer;
    padding: 2px 0;
}
.accent-choose-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-mid);
    cursor: pointer;
    transition: color 0.2s;
}
.accent-choose-btn:hover {
    color: var(--text-high);
}
.accent-choose-btn .accent-chevron {
    font-size: 10px;
    transition: transform 0.3s ease;
}
.accent-preview-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.4);
    flex-shrink: 0;
}

/* --- Snow Canvas --- */
#snow-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 999;
    display: none;
}

/* --- Toggle --- */
.toggle-switch {
    width: 36px;
    height: 18px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50px;
    position: relative;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
}

.toggle-switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.toggle-switch.on {
    background: var(--accent);
    box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.3);
}

.toggle-switch.on::after { left: 21px; }

/* --- Slider --- */
.slider-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 110px;
    flex-shrink: 0;
}

input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    outline: none;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0,0,0,0.4);
    transition: transform 0.2s;
}

input[type="range"]:hover::-webkit-slider-thumb {
    transform: scale(1.2);
    box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.4);
}

.slider-val {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-low);
    min-width: 22px;
    text-align: right;
    transition: color 0.2s;
}

input[type="range"]:active + .slider-val,
input[type="range"]:hover + .slider-val { color: var(--accent); }

/* Action btn */
.action-btn {
    color: var(--text-low);
    font-size: 11px;
    transition: color 0.2s;
}
.function-item:hover .action-btn { color: var(--text-mid); }

/* Notification */
.notification {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(14, 14, 17, 0.95);
    border: 1px solid rgba(var(--accent-rgb), 0.3);
    color: var(--text-high);
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 100;
}
.notification.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* --- PLAYER LIST COMPONENT --- */
.player-list-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 220px;
    overflow-y: auto;
    padding-right: 6px;
    margin-top: 8px;
    width: 100%;
}

.player-list-container::-webkit-scrollbar {
    display: block;
    width: 4px;
}

.player-list-container::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.01);
    border-radius: 4px;
}

.player-list-container::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.08);
    border-radius: 4px;
}

.player-list-container::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
}

.player-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid rgba(255, 255, 255, 0.03);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.player-list-item:hover {
    background: rgba(255, 255, 255, 0.04);
    border-color: rgba(var(--accent-rgb), 0.2);
    transform: translateX(2px);
}

.player-list-item.active {
    background: rgba(var(--accent-rgb), 0.08);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.15);
}

.player-id {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    font-family: monospace;
}

.player-name {
    font-size: 12.5px;
    color: var(--text-mid);
    font-weight: 500;
    transition: color 0.2s;
}

.player-list-item:hover .player-name,
.player-list-item.active .player-name {
    color: var(--text-high);
}

.player-list-empty {
    font-size: 12px;
    color: var(--text-low);
    text-align: center;
    padding: 20px 0;
    font-style: italic;
}
</style>
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    <div class="menu-wrapper">
        <div class="menu-container">
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <span class="brand-main">Solaris</span> <span class="brand-sub">Menu</span>
                </div>
                <nav class="sidebar-nav">
                    <div class="sidebar-indicator" id="sidebar-indicator"></div>
                    <div class="nav-section">
                        <div class="nav-section-title">Main</div>
                        <a href="#" class="nav-item active" data-category="player">
                            <i class="fa-solid fa-user"></i> Player
                        </a>
                        <a href="#" class="nav-item" data-category="vehicles">
                            <i class="fa-solid fa-car"></i> Vehicles
                        </a>
                        <a href="#" class="nav-item" data-category="weapons">
                            <i class="fa-solid fa-gun"></i> Weapons
                        </a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">Server</div>
                        <a href="#" class="nav-item" data-category="online">
                            <i class="fa-solid fa-users"></i> Online
                        </a>
                        <a href="#" class="nav-item" data-category="utils">
                            <i class="fa-solid fa-wrench"></i> Utils
                        </a>
                        <a href="#" class="nav-item" data-category="server">
                            <i class="fa-solid fa-server"></i> Server
                        </a>
                    </div>
                    <div class="nav-section">
                        <a href="#" class="nav-item" data-category="exploits">
                            <i class="fa-solid fa-skull"></i> Exploits
                        </a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">Extra Options</div>
                        <a href="#" class="nav-item" data-category="configs">
                            <i class="fa-solid fa-gear"></i> Configs
                        </a>
                    </div>
                </nav>
            </aside>

            <main class="main-content">
                <div class="top-bar">
                    <div class="sub-tabs" id="sub-tabs"></div>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="function-search" placeholder="Search">
                    </div>
                </div>
                <div class="content-grid" id="tile-grid"></div>
            </main>
        </div>
    </div>

    <div id="notification" class="notification"></div>

<script>
/*
    Solaris Menu - Professional CEF/DUI dashboard for FiveM
    Dynamic elements populated via PostMessages and NUI callbacks
*/

const menuData = {
    player: {
        subTabs: [
            { id: "main", label: "Main", icon: "fa-user" },
            { id: "teleports", label: "Teleports", icon: "fa-location-dot" },
            { id: "clothes", label: "Clothes", icon: "fa-shirt" }
        ],
        main: [
            {
                group: "General Options", icon: "fa-user",
                items: [
                    { id: "revive", label: "Revive", type: "action" },

let currentCategory = 'player';
let currentSubTab = 'main';
let searchQuery = '';
let playerSearchQuery = '';
let isTransitioning = false;

// Dynamic player selection caching
let selectedPlayerId = null;
let selectedPlayerName = null;

const tileGrid = document.getElementById('tile-grid');
const subTabsContainer = document.getElementById('sub-tabs');
const searchInput = document.getElementById('function-search');
const notification = document.getElementById('notification');

function init() {
    renderSubTabs();
    renderContent();
    setupEvents();
    setupMenuDrag();
    // Initialize sidebar indicator position
    requestAnimationFrame(() => {
        const activeNav = document.querySelector('.nav-item.active');
        if (activeNav) updateSidebarIndicator(activeNav);
    });
}

/* ---- Render sub-tabs for current category ---- */
function renderSubTabs() {
    subTabsContainer.innerHTML = '';
    const catData = menuData[currentCategory];
    if (!catData) return;

    const tabs = catData.subTabs;
    if (!tabs || tabs.length === 0) return;

    tabs.forEach((tab, i) => {
        const el = document.createElement('div');
        el.className = 'sub-tab' + (tab.id === currentSubTab ? ' active' : '');
        el.setAttribute('data-subtab', tab.id);
        el.innerHTML = `<i class="fa-solid ${tab.icon}"></i> ${tab.label}`;
        el.onclick = () => {
            if (tab.id === currentSubTab || isTransitioning) return;
            currentSubTab = tab.id;
            // Update active sub-tab styling
            subTabsContainer.querySelectorAll('.sub-tab').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            // Crossfade content
            switchContent();
        };
        subTabsContainer.appendChild(el);
    });
}

/* ---- Render content for current category + sub-tab ---- */
function renderContent() {
    const catData = menuData[currentCategory];
    if (!catData) return;

    // Determine which group data to show
    let groups;
    if (catData.subTabs && catData.subTabs.length > 0) {
        groups = catData[currentSubTab];
    } else {
        groups = catData.default;
    }
    if (!groups) return;

    tileGrid.innerHTML = '';
    tileGrid.scrollTop = 0;

    groups.forEach((group, groupIdx) => {
        const filteredItems = group.items.filter(item =>
            item.label.toLowerCase().includes(searchQuery)
        );
        if (filteredItems.length === 0) return;

        const tile = document.createElement('div');
        tile.className = 'tile tile-entry-anim';
        tile.style.animationDelay = `${groupIdx * 60}ms`;

        const tileHeader = `
            <div class="tile-header">
                <i class="fa-solid ${group.icon} tile-icon"></i>
                <span>${group.group}</span>
            </div>
        `;

        const itemsContainer = document.createElement('div');
        itemsContainer.className = 'tile-items';

        filteredItems.forEach((item, itemIdx) => {
            const delay = `${(groupIdx * 60) + (itemIdx * 25) + 80}ms`;

            if (item.type === 'text') {
                // Text input item
                const wrap = document.createElement('div');
                wrap.className = 'text-input-wrap item-entry-anim';
                wrap.style.animationDelay = delay;
                wrap.innerHTML = `
                    <label>${item.label}</label>
                    <input type="text" placeholder="${item.placeholder || ''}" data-id="${item.id}" value="${item.value || ''}">
                `;
                const input = wrap.querySelector('input');
                input.oninput = (e) => {
                    item.value = e.target.value;
                    if (item.id === 'search_player') {
                        playerSearchQuery = e.target.value;
                        filterPlayerListDOM();
                    } else {
                        onInteraction(item.id, item.value);
                    }
                };
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        if (item.id !== 'search_player') {
                            onInteraction(item.id, item.value);
                            input.blur();
                            showNotify(`Set ${item.label}: ${item.value}`);
                        }
                    }
                };
                itemsContainer.appendChild(wrap);
                return;
            }

            if (item.type === 'playerlist') {
                // Custom Player list rendering
                const wrap = document.createElement('div');
                wrap.className = 'player-list-container item-entry-anim';
                wrap.style.animationDelay = delay;
                wrap.id = 'player-list-container';
                itemsContainer.appendChild(wrap);
                
                // Trigger populating list container asynchronously to ensure DOM exists
                setTimeout(filterPlayerListDOM, 0);
                return;
            }

            if (item.type === 'info') {
                // Info display item
                const itemEl = document.createElement('div');
                itemEl.className = 'function-item info-item item-entry-anim';
                itemEl.style.animationDelay = delay;
                itemEl.innerHTML = `<span class="function-label">${item.label}</span>`;
                itemsContainer.appendChild(itemEl);
                return;
            }

            if (item.type === 'accent') {
                const itemEl = document.createElement('div');
                itemEl.className = 'function-item item-entry-anim';
                itemEl.style.flexDirection = 'column';
                itemEl.style.alignItems = 'flex-start';
                itemEl.style.animationDelay = delay;
                itemEl.style.width = '100%';
                itemEl.style.cursor = 'default';

                itemEl.innerHTML = `
                    <div class="accent-choose-row" id="accent-toggle-${item.id}">
                        <span class="function-label">${item.label}</span>
                        <div class="accent-choose-btn">
                            <div class="accent-preview-dot" id="accent-preview-${item.id}"></div>
                            <span>Choose Color</span>
                            <i class="fa-solid fa-chevron-down accent-chevron"></i>
                        </div>
                    </div>
                    <div class="custom-color-picker-wrap collapsed" id="picker-wrap-${item.id}">
                        <div class="color-picker-canvas" id="canvas-${item.id}">
                            <div class="canvas-white-overlay"></div>
                            <div class="canvas-black-overlay"></div>
                            <div class="color-picker-handle" id="handle-${item.id}"></div>
                        </div>
                        <div class="hue-slider-container" id="hue-track-${item.id}">
                            <div class="hue-slider-handle" id="hue-handle-${item.id}"></div>
                        </div>
                    </div>
                `;

                itemsContainer.appendChild(itemEl);

                // Toggle picker expand/collapse on Choose Color click
                const accentToggleBtn = itemEl.querySelector(`#accent-toggle-${item.id}`);
                const pickerWrap = itemEl.querySelector(`#picker-wrap-${item.id}`);
                accentToggleBtn.addEventListener('click', () => {
                    pickerWrap.classList.toggle('collapsed');
                    const chevron = accentToggleBtn.querySelector('.accent-chevron');
                    chevron.style.transform = pickerWrap.classList.contains('collapsed') ? '' : 'rotate(180deg)';
                    if (!pickerWrap.classList.contains('collapsed')) {
                        setTimeout(updatePickerUI, 50);
                    }
                });

                // Initialize HSV values from saved value or defaults (Teal)
                if (!item.hsv) {
                    item.hsv = { h: 164, s: 100, v: 71 }; 
                }

                const canvas = itemEl.querySelector(`#canvas-${item.id}`);
                const handle = itemEl.querySelector(`#handle-${item.id}`);
                const hueTrack = itemEl.querySelector(`#hue-track-${item.id}`);
                const hueHandle = itemEl.querySelector(`#hue-handle-${item.id}`);

                function updatePickerUI() {
                    canvas.style.backgroundColor = `hsl(${item.hsv.h}, 100%, 50%)`;
                    handle.style.left = `${item.hsv.s}%`;
                    handle.style.top = `${100 - item.hsv.v}%`;
                    hueHandle.style.left = `${(item.hsv.h / 360) * 100}%`;

                    const isRgbActive = menuData.configs.general[0].items.find(i => i.id === 'rgb_rainbow').value;
                    if (!isRgbActive) {
                        const [r, g, b] = hsvToRgb(item.hsv.h, item.hsv.s, item.hsv.v);
                        const hex = rgbToHex(r, g, b);
                        setAccentColor(hex, `${r}, ${g}, ${b}`, hex);
                    }
                }

                let isDraggingCanvas = false;
                let isDraggingHue = false;

                function handleCanvasDrag(e) {
                    const rect = canvas.getBoundingClientRect();
                    let x = e.clientX - rect.left;
                    let y = e.clientY - rect.top;

                    x = Math.max(0, Math.min(x, rect.width));
                    y = Math.max(0, Math.min(y, rect.height));

                    item.hsv.s = Math.round((x / rect.width) * 100);
                    item.hsv.v = Math.round((1 - y / rect.height) * 100);

                    updatePickerUI();
                    onInteraction(item.id, `hsv(${item.hsv.h}, ${item.hsv.s}%, ${item.hsv.v}%)`);
                }

                function handleHueDrag(e) {
                    const rect = hueTrack.getBoundingClientRect();
                    let x = e.clientX - rect.left;
                    x = Math.max(0, Math.min(x, rect.width));

                    item.hsv.h = Math.round((x / rect.width) * 360);
                    updatePickerUI();
                    onInteraction(item.id, `hsv(${item.hsv.h}, ${item.hsv.s}%, ${item.hsv.v}%)`);
                }

                canvas.addEventListener('mousedown', (e) => {
                    isDraggingCanvas = true;
                    handleCanvasDrag(e);
                });

                hueTrack.addEventListener('mousedown', (e) => {
                    isDraggingHue = true;
                    handleHueDrag(e);
                });

                window.addEventListener('mousemove', (e) => {
                    if (isDraggingCanvas) handleCanvasDrag(e);
                    if (isDraggingHue) handleHueDrag(e);
                });

                window.addEventListener('mouseup', () => {
                    isDraggingCanvas = false;
                    isDraggingHue = false;
                });

                setTimeout(updatePickerUI, 0);
                return;
            }

            const itemEl = document.createElement('div');
            const isAction = item.type === 'action';
            itemEl.className = 'function-item item-entry-anim' + (isAction ? ' action-item' : '');
            itemEl.setAttribute('data-sol-id', item.id);
            if (item.type === 'toggle' && item.value) {
                itemEl.classList.add('toggled-on');
            }
            itemEl.style.animationDelay = delay;

            let control = '';
            if (item.type === 'toggle') {
                control = `<div class="toggle-switch ${item.value ? 'on' : ''}" data-id="${item.id}"></div>`;
            } else if (item.type === 'slider') {
                control = `
                    <div class="slider-wrap">
                        <input type="range" min="0" max="100" value="${item.value}" data-id="${item.id}">
                        <span class="slider-val">${item.value}</span>
                    </div>
                `;
            } else {
                control = `<span class="action-btn"><i class="fa-solid fa-chevron-right"></i></span>`;
            }

            if (isAction) {
                itemEl.innerHTML = `<span class="function-label">${item.label}</span>`;
            } else {
                itemEl.innerHTML = `
                    <span class="function-label">${item.label}</span>
                    <div class="function-control">${control}</div>
                `;
            }

            // Interaction logic
            if (item.type === 'toggle') {
                itemEl.querySelector('.toggle-switch').onclick = (e) => {
                    item.value = !item.value;
                    e.currentTarget.classList.toggle('on');
                    itemEl.classList.toggle('toggled-on', item.value);
                    onInteraction(item.id, item.value);
                    
                    if (item.id === 'rgb_rainbow') {
                        if (item.value) {
                            startRGBRainbow();
                        } else {
                            stopRGBRainbow();
                        }
                    }
                    if (item.id === 'snow_effect') {
                        if (item.value) {
                            startSnowEffect();
                        } else {
                            stopSnowEffect();
                        }
                    }
                };
            } else if (item.type === 'slider') {
                const slider = itemEl.querySelector('input[type="range"]');
                const valDisplay = itemEl.querySelector('.slider-val');
                slider.oninput = (e) => {
                    item.value = e.target.value;
                    valDisplay.textContent = item.value;
                    onInteraction(item.id, item.value);
                };
            } else if (item.type === 'action') {
                itemEl.onclick = () => {
                    if (item.id === 'change_bind') {
                        startListeningForKey(item, itemEl);
                    } else {
                        onInteraction(item.id, 'executed');
                        showNotify(`Action: ${item.label}`);
                    }
                };
            }

            itemsContainer.appendChild(itemEl);
        });

        tile.innerHTML = tileHeader;
        tile.appendChild(itemsContainer);
        tileGrid.appendChild(tile);
    });
}

/* ---- Dynamic Online Player List filter & renderer ---- */
function filterPlayerListDOM() {
    const container = document.getElementById('player-list-container');
    if (!container) return;
    
    const playerItem = menuData.online.default.find(g => g.group === "Player List").items.find(i => i.id === "players_container");
    const players = playerItem ? (playerItem.players || []) : [];
    
    container.innerHTML = '';
    
    if (players.length === 0) {
        container.innerHTML = `<div class="player-list-empty">No players online</div>`;
        return;
    }
    
    const query = playerSearchQuery.trim().toLowerCase();
    const filtered = players.filter(p => 
        p.name.toLowerCase().includes(query) || 
        p.id.toString().includes(query)
    );
    
    if (filtered.length === 0) {
        container.innerHTML = `<div class="player-list-empty">No matching players</div>`;
        return;
    }
    
    filtered.forEach(p => {
        const activeClass = selectedPlayerId === p.id ? 'active' : '';
        const itemEl = document.createElement('div');
        itemEl.className = `player-list-item ${activeClass}`;
        itemEl.setAttribute('data-id', p.id);
        itemEl.innerHTML = `
            <span class="player-id">[${p.id}]</span>
            <span class="player-name">${p.name}</span>
        `;
        itemEl.onclick = () => {
            selectedPlayerId = p.id;
            selectedPlayerName = p.name;
            
            container.querySelectorAll('.player-list-item').forEach(el => el.classList.remove('active'));
            itemEl.classList.add('active');
            
            // Trigger selection callback
            onInteraction('select_player', { id: p.id, name: p.name });
            updatePlayerOptionsUI();
        };
        container.appendChild(itemEl);
    });
}

/* ---- Seamless NUI callback gateway for FiveM Shark Executor ---- */
let _solClipSeq = 0;
/* Clipboard relay: reliable inbound channel for SharkAPI DUIs (Lua polls
   GetClipboardText). Each interaction is copied as SOLARIS_NUI::seq::json. */
function solClipboardRelay(payload) {
    try {
        _solClipSeq++;
        payload._seq = _solClipSeq;
        const s = 'SOLARIS_NUI::' + _solClipSeq + '::' + JSON.stringify(payload);
        const ta = document.createElement('textarea');
        ta.value = s;
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(s).catch(() => {});
        }
        try { console.log(s); } catch (e) {}
    } catch (e) {}
}

function sendToLua(action, data) {
    console.log(`[sendToLua] Action: ${action} | Data:`, data);

    let resourceName = "";
    try {
        resourceName = GetParentResourceName();
    } catch(e) {}

    // 1. Send via local resource NUI callback endpoint
    if (resourceName && resourceName !== "") {
        fetch(`https://${resourceName}/${action}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=UTF-8' },
            body: JSON.stringify(data)
        }).catch(err => console.warn('Fetch resource NUI callback failed:', err));
    }

    // 2. Send via generic FiveM NUI-callback endpoint (highly compatible for DUIs)
    fetch(`https://nui-callback/${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data)
    }).catch(err => console.warn('Fetch nui-callback endpoint failed:', err));

    // 3. Clipboard relay fallback (works on executors without NUI callbacks)
    if (action === 'interaction') {
        solClipboardRelay(data);
    }
}

function onInteraction(id, val) {
    console.log(`[Interaction] ${id} ->`, val);

    const payload = {
        id: id,
        value: val,
        selectedPlayerId: selectedPlayerId,
        selectedPlayerName: selectedPlayerName
    };

    try { sessionStorage.setItem('__sol_last', JSON.stringify(payload)); } catch (e) {}

    // Package item id, current value, and selected player details to Lua
    sendToLua('interaction', payload);
}

/* ---- Drag menu anywhere on the panel (hold LMB on empty/chrome areas) ---- */
let menuOffsetX = 0;
let menuOffsetY = 0;

function applyMenuPosition() {
    const wrap = document.querySelector('.menu-wrapper');
    if (!wrap) return;
    wrap.style.transform = `translate(${menuOffsetX}px, ${menuOffsetY}px)`;
}

function setupMenuDrag() {
    const wrapper = document.querySelector('.menu-wrapper');
    if (!wrapper) return;

    try {
        const saved = JSON.parse(sessionStorage.getItem('__sol_menu_pos') || '{}');
        menuOffsetX = Number(saved.x) || 0;
        menuOffsetY = Number(saved.y) || 0;
    } catch (e) {}
    applyMenuPosition();

    const DRAG_SKIP = '.toggle-switch, input, button, select, textarea, .nav-item, a, input[type="range"], .player-list-item, .accent-choose-row, .action-btn, .slider-wrap, .sub-tab, .search-box input';
    let drag = null;

    wrapper.addEventListener('mousedown', (e) => {
        if (e.target.closest(DRAG_SKIP)) return;
        drag = { sx: e.clientX, sy: e.clientY, ox: menuOffsetX, oy: menuOffsetY, moved: false };
    }, true);

    document.addEventListener('mousemove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.sx;
        const dy = e.clientY - drag.sy;
        if (!drag.moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
            drag.moved = true;
            wrapper.classList.add('sol-dragging');
            window.__sol_suppressClick = true;
        }
        if (!drag.moved) return;
        menuOffsetX = drag.ox + dx;
        menuOffsetY = drag.oy + dy;
        applyMenuPosition();
    });

    document.addEventListener('mouseup', () => {
        if (!drag) return;
        if (drag.moved) {
            try {
                sessionStorage.setItem('__sol_menu_pos', JSON.stringify({ x: menuOffsetX, y: menuOffsetY }));
            } catch (e) {}
            setTimeout(() => { window.__sol_suppressClick = false; }, 80);
        }
        wrapper.classList.remove('sol-dragging');
        drag = null;
    });
}

function showNotify(msg) {
    if (!notification) return;
    notification.textContent = msg;
    notification.classList.add('show');
    clearTimeout(window.notifTimeout);
    window.notifTimeout = setTimeout(() => {
        notification.classList.remove('show');
    }, 2000);
}

/* ---- Keybind Listening & Accent Picker Helpers ---- */
let isListeningForKey = false;
function startListeningForKey(item, itemEl) {
    if (isListeningForKey) return;
    isListeningForKey = true;

    const labelEl = itemEl.querySelector('.function-label');

    labelEl.textContent = "Change Bind [Press Key...]";
    labelEl.style.color = "var(--accent)";

    function onKeyDown(e) {
        e.preventDefault();
        e.stopPropagation();

        if (e.key === 'Escape') {
            window.removeEventListener('keydown', onKeyDown, true);
            isListeningForKey = false;
            renderContent();
            showNotify('Keybind change cancelled');
            return;
        }

        let keyName = e.key;
        if (keyName === ' ') keyName = 'SPACE';
        else if (keyName.length === 1) keyName = keyName.toUpperCase();
        else keyName = keyName.charAt(0).toUpperCase() + keyName.slice(1);

        item.label = `Change Bind [${keyName}]`;
        
        window.removeEventListener('keydown', onKeyDown, true);
        isListeningForKey = false;

        renderContent();
        onInteraction(item.id, keyName);
        showNotify(`Keybind updated to: ${keyName}`);
    }

    window.addEventListener('keydown', onKeyDown, true);
}

let rgbInterval = null;
let rgbHue = 0;

function hslToRgb(h, s, l) {
    s /= 100;
    l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}

function hsvToRgb(h, s, v) {
    s /= 100;
    v /= 100;
    const c = v * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = v - c;
    let r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}

function rgbToHex(r, g, b) {
    return "#" + [r, g, b].map(x => {
        const hex = x.toString(16);
        return hex.length === 1 ? "0" + hex : hex;
    }).join("");
}

function startRGBRainbow() {
    if (rgbInterval) return;
    
    function cycle() {
        const rgbRainbowItem = menuData.configs.general[0].items.find(i => i.id === 'rgb_rainbow');
        if (!rgbRainbowItem || !rgbRainbowItem.value) {
            rgbInterval = null;
            applyPresetAccent();
            return;
        }
        rgbHue = (rgbHue + 0.7) % 360;
        const [r, g, b] = hslToRgb(rgbHue, 95, 50);
        const hex = rgbToHex(r, g, b);
        
        const [br, bg, bb] = hslToRgb(rgbHue, 95, 60);
        const brightHex = rgbToHex(br, bg, bb);
        
        setAccentColor(hex, `${r}, ${g}, ${b}`, brightHex);
        rgbInterval = requestAnimationFrame(cycle);
    }
    
    rgbInterval = requestAnimationFrame(cycle);
}

function stopRGBRainbow() {
    applyPresetAccent();
}

function applyPresetAccent() {
    const accentItem = menuData.configs.general[0].items.find(i => i.id === 'menu_accent');
    // Restore custom HSV color if set
    if (accentItem && accentItem.hsv) {
        const [r, g, b] = hsvToRgb(accentItem.hsv.h, accentItem.hsv.s, accentItem.hsv.v);
        const hex = rgbToHex(r, g, b);
        setAccentColor(hex, `${r}, ${g}, ${b}`, hex);
        return;
    }
    const selectedColor = accentItem ? accentItem.value : 'solaris';
    
    const colors = {
        solaris: { hex: '#ff9500', rgb: '255, 149, 0', bright: '#ffb700' },
        green: { hex: '#22c55e', rgb: '34, 197, 94', bright: '#4ade80' },
        blue: { hex: '#3b82f6', rgb: '59, 130, 246', bright: '#60a5fa' },
        purple: { hex: '#a855f7', rgb: '168, 85, 247', bright: '#c084fc' },
        red: { hex: '#ef4444', rgb: '239, 68, 68', bright: '#f87171' },
        pink: { hex: '#ec4899', rgb: '236, 72, 153', bright: '#f472b6' },
        amber: { hex: '#eab308', rgb: '234, 179, 8', bright: '#facc15' },
        cyan: { hex: '#06b6d4', rgb: '6, 182, 212', bright: '#22d3ee' }
    };
    
    const c = colors[selectedColor] || colors.solaris;
    setAccentColor(c.hex, c.rgb, c.bright);
}

function setAccentColor(hex, rgb, brightHex) {
    document.documentElement.style.setProperty('--accent', hex);
    document.documentElement.style.setProperty('--accent-rgb', rgb);
    if (brightHex) {
        document.documentElement.style.setProperty('--accent-bright', brightHex);
    }
}

/* ---- Snow Effect Engine ---- */
let snowAnimId = null;
let snowflakes = [];
const SNOW_COUNT = 120;

function startSnowEffect() {
    const canvas = document.getElementById('snow-canvas');
    if (!canvas) return;
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    snowflakes = [];
    for (let i = 0; i < SNOW_COUNT; i++) {
        snowflakes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2.5 + 0.5,
            speed: Math.random() * 1.5 + 0.4,
            wind: Math.random() * 0.5 - 0.25,
            opacity: Math.random() * 0.5 + 0.3,
            sway: Math.random() * Math.PI * 2
        });
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        snowflakes.forEach(flake => {
            ctx.beginPath();
            ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
            ctx.fill();

            flake.y += flake.speed;
            flake.sway += 0.01;
            flake.x += Math.sin(flake.sway) * 0.4 + flake.wind;

            if (flake.y > canvas.height + flake.r) {
                flake.y = -flake.r;
                flake.x = Math.random() * canvas.width;
            }
            if (flake.x > canvas.width) flake.x = 0;
            if (flake.x < 0) flake.x = canvas.width;
        });
        snowAnimId = requestAnimationFrame(animate);
    }

    animate();
}

function stopSnowEffect() {
    if (snowAnimId) {
        cancelAnimationFrame(snowAnimId);
        snowAnimId = null;
    }
    const canvas = document.getElementById('snow-canvas');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.style.display = 'none';
    }
    snowflakes = [];
}

function applyStateSync(stateObj) {
    if (!stateObj) return;
    Object.keys(menuData).forEach(catKey => {
        const cat = menuData[catKey];
        Object.keys(cat).forEach(k => {
            if (k === 'subTabs') return;
            const groups = cat[k];
            if (!Array.isArray(groups)) return;
            groups.forEach(group => {
                (group.items || []).forEach(item => {
                    if (item.id in stateObj && item.type === 'toggle') {
                        item.value = stateObj[item.id] === true;
                    }
                });
            });
        });
    });
    renderContent();
}

function setMenuVisible(visible) {
    const wrap = document.querySelector('.menu-wrapper');
    if (wrap) wrap.style.display = visible ? 'flex' : 'none';
}

function syncSolItemValue(id, val) {
    Object.keys(menuData).forEach(catKey => {
        const cat = menuData[catKey];
        Object.keys(cat).forEach(k => {
            if (k === 'subTabs') return;
            const groups = cat[k];
            if (!Array.isArray(groups)) return;
            groups.forEach(group => {
                (group.items || []).forEach(item => {
                    if (item.id === id) item.value = val;
                });
            });
        });
    });
}

window.__solClickAt = function(x, y) {
    if (window.__sol_suppressClick) return;
    const el = document.elementFromPoint(x, y);
    if (!el) return;

    // Slider: set value from click x position.
    const range = el.closest('input[type="range"]');
    if (range) {
        const r = range.getBoundingClientRect();
        let pct = r.width > 0 ? (x - r.left) / r.width : 0;
        pct = Math.max(0, Math.min(1, pct));
        const mn = parseFloat(range.min) || 0;
        const mx = parseFloat(range.max) || 100;
        range.value = Math.round(mn + pct * (mx - mn));
        range.dispatchEvent(new Event('input', { bubbles: true }));
        return;
    }

    const nav = el.closest('.nav-item');
    if (nav) {
        switchCategory(nav.getAttribute('data-category'));
        return;
    }

    const sub = el.closest('.sub-tab');
    if (sub) {
        sub.click();
        return;
    }

    const sw = el.closest('.toggle-switch');
    if (sw) {
        const row = sw.closest('[data-sol-id]');
        const id = row ? row.getAttribute('data-sol-id') : sw.getAttribute('data-id');
        if (!id) return;
        sw.classList.toggle('on');
        const v = sw.classList.contains('on');
        if (row) row.classList.toggle('toggled-on', v);
        syncSolItemValue(id, v);
        onInteraction(id, v);
        return;
    }

    const row = el.closest('[data-sol-id]');
    if (row && row.classList.contains('action-item')) {
        onInteraction(row.getAttribute('data-sol-id'), 'executed');
        return;
    }

    const pl = el.closest('.player-list-item');
    if (pl) {
        pl.click();
        return;
    }
};

window.handleDuiMessage = function (data) {
    try { window.postMessage(data, '*'); } catch (e) {}
    if (data && data.type === 'solaris:click' && window.__solClickAt) {
        window.__solClickAt(data.x, data.y);
    }
};

window.addEventListener("message", (event) => {
    let data = event.data;
    if (typeof data === "string") {
        try { data = JSON.parse(data); } catch (e) { return; }
    }
    if (!data || !data.type) return;

    if (data.type === 'solaris:click') {
        if (window.__solClickAt) window.__solClickAt(data.x, data.y);
        return;
    }

    if (data.type === "solaris:visible") {
        setMenuVisible(data.visible === true);
        return;
    }
    if (data.type === "solaris:setState") {
        applyStateSync(data.state);
        return;
    }
    if (data.type === "solaris:notify" || data.type === "notify") {
        showNotify(data.text || data.title || "");
        return;
    }

    // 1. Dynamic User Infos updates
    if (data.type === "updateUserInfos") {
        const generalItems = menuData.configs.general.find(g => g.group === "User Infos").items;
        if (data.username) {
            const item = generalItems.find(i => i.id === "user_name");
            if (item) item.label = `User: ${data.username}`;
        }
        if (data.subscription) {
            const item = generalItems.find(i => i.id === "user_sub");
            if (item) item.label = `Subscription: ${data.subscription}`;
        }
        if (data.serverName) {
            const item = generalItems.find(i => i.id === "server_name_info");
            if (item) item.label = `Server: ${data.serverName}`;
        }
        if (data.playersCount) {
            const item = generalItems.find(i => i.id === "players_online");
            if (item) item.label = `Players Online: ${data.playersCount}`;
        }
        if (data.serverFramework) {
            const item = generalItems.find(i => i.id === "server_fw");
            if (item) item.label = `Server Framework: ${data.serverFramework}`;
        }
        if (data.serverAnticheat) {
            const item = generalItems.find(i => i.id === "server_ac");
            if (item) item.label = `Server Anticheat: ${data.serverAnticheat}`;
        }
        if (data.resourceAnticheat) {
            const item = generalItems.find(i => i.id === "resource_ac");
            if (item) item.label = `Resource Anticheat: ${data.resourceAnticheat}`;
        }
        
        if (currentCategory === 'configs' && currentSubTab === 'general') {
            renderContent();
        }
    }

    // 2. Dynamic Player list updates
    if (data.type === "updatePlayerList") {
        const playerItem = menuData.online.default.find(g => g.group === "Player List").items.find(i => i.id === "players_container");
        if (playerItem) {
            playerItem.players = data.players || [];
        }
        if (currentCategory === 'online') {
            filterPlayerListDOM();
        }
    }
});

init();
setMenuVisible(false);
</script>
</body>
</html>
