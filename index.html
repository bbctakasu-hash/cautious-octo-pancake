<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris Menu</title>
    <!-- No Google Fonts in DUI — they block load 5–30s in-game -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display:none">
    <canvas id="snow-canvas"></canvas>
    <div class="menu-wrapper">
        <div class="menu-container">
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <span class="brand-main">Solaris</span> <span class="brand-sub">Menu</span>
                </div>
                <nav class="sidebar-nav">
                    <div class="sidebar-indicator" id="sidebar-indicator"></div>
                    <div class="nav-section">
                        <div class="nav-section-title">Main</div>
                        <a href="#" class="nav-item active" data-category="player">
                            <i class="fa-solid fa-user"></i> Player
                        </a>
                        <a href="#" class="nav-item" data-category="vehicles">
                            <i class="fa-solid fa-car"></i> Vehicles
                        </a>
                        <a href="#" class="nav-item" data-category="weapons">
                            <i class="fa-solid fa-gun"></i> Weapons
                        </a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">Server</div>
                        <a href="#" class="nav-item" data-category="online">
                            <i class="fa-solid fa-users"></i> Online
                        </a>
                        <a href="#" class="nav-item" data-category="utils">
                            <i class="fa-solid fa-wrench"></i> Utils
                        </a>
                        <a href="#" class="nav-item" data-category="server">
                            <i class="fa-solid fa-server"></i> Server
                        </a>
                    </div>
                    <div class="nav-section">
                        <a href="#" class="nav-item" data-category="exploits">
                            <i class="fa-solid fa-skull"></i> Exploits
                        </a>
                    </div>
                    <div class="nav-section">
                        <div class="nav-section-title">Extra Options</div>
                        <a href="#" class="nav-item" data-category="configs">
                            <i class="fa-solid fa-gear"></i> Configs
                        </a>
                    </div>
                </nav>
            </aside>

            <main class="main-content">
                <div class="top-bar">
                    <div class="sub-tabs" id="sub-tabs"></div>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="function-search" placeholder="Search">
                    </div>
                </div>
                <div class="content-grid" id="tile-grid"></div>
            </main>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body></html>
