<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solaris Menu</title>
    <link rel="stylesheet" href="styles.css">
    <!-- No external CDN fonts/icons in DUI — they block page load for 30s+ in-game. -->
</head>
<body>
    <!-- Watermarks -->
    <div class="watermark-container">
        <div class="watermark-pill">
            <svg class="wm-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="32" y="64" width="192" height="128" rx="16" stroke-width="20"></rect><line x1="68" y1="112" x2="68" y2="112" stroke-width="24"></line><line x1="108" y1="112" x2="108" y2="112" stroke-width="24"></line><line x1="148" y1="112" x2="148" y2="112" stroke-width="24"></line><line x1="188" y1="112" x2="188" y2="112" stroke-width="24"></line><line x1="96" y1="152" x2="160" y2="152" stroke-width="20"></line></svg>
            <span class="wm-highlight">Hotkeys</span>
        </div>
        <div class="watermark-pill">
            <svg class="wm-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><path d="M152,208V160a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v48"></path><path d="M224,115.5V208a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.5a16,16,0,0,1,5.2-11.8l80-75.5a16,16,0,0,1,21.6,0l80,75.5A16,16,0,0,1,224,115.5Z"></path></svg>
            <span class="wm-highlight">Solaris</span>
        </div>
        <div class="watermark-pill">
            <svg class="wm-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="96" r="64"></circle><path d="M31,216a112,112,0,0,1,194,0"></path></svg>
            <span class="wm-highlight">Nevyhua</span>
        </div>
        <div class="watermark-pill">
            <svg class="wm-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><circle cx="128" cy="128" r="44"></circle><path d="M183.7,65.1q3.8,3.5,7.2,7.2l27.3-3.9a103.2,103.2,0,0,1,10.2,24.6l-25.6,10.6a88.1,88.1,0,0,1,0,52.8l25.6,10.6a103.2,103.2,0,0,1-10.2,24.6l-27.3-3.9q-3.4,3.7-7.2,7.2l-3.9,27.3a103.2,103.2,0,0,1-24.6,10.2l-10.6-25.6a88.1,88.1,0,0,1-52.8,0l-10.6,25.6a103.2,103.2,0,0,1-24.6-10.2l-3.9-27.3q-3.8-3.5-7.2-7.2l-27.3,3.9a103.2,103.2,0,0,1-10.2-24.6l25.6-10.6a88.1,88.1,0,0,1,0-52.8L12,96.8A103.2,103.2,0,0,1,22.2,72.2l27.3,3.9q3.4-3.7,7.2-7.2l3.9-27.3a103.2,103.2,0,0,1,24.6-10.2l10.6,25.6a88.1,88.1,0,0,1,52.8,0l10.6-25.6a103.2,103.2,0,0,1,24.6,10.2Z"></path></svg>
            <span class="wm-highlight">Release</span>
        </div>
        <div class="watermark-pill">
            <svg class="wm-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><rect x="32" y="48" width="192" height="128" rx="16"></rect><line x1="128" y1="176" x2="128" y2="216"></line><line x1="88" y1="216" x2="168" y2="216"></line></svg>
            <span class="wm-green">84</span> fps
        </div>
        <div class="watermark-pill">
            <svg class="wm-icon" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="200" y1="40" x2="200" y2="216" stroke-width="24"></line><line x1="144" y1="96" x2="144" y2="216" stroke-width="24"></line><line x1="88" y1="152" x2="88" y2="216" stroke-width="24"></line><line x1="32" y1="192" x2="32" y2="216" stroke-width="24"></line></svg>
            <span class="wm-green">14</span> Ping
        </div>
    </div>

    <div class="menu-container hidden" id="menu-container">
        <!-- Header Banner -->
        <div class="header-banner">
            <div class="banner-identity">
                <img class="bi-avatar" id="bi-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="">
                <div class="bi-text">
                    <span class="bi-name" id="bi-name">Solaris</span>
                    <span class="bi-sub" id="bi-sub">connecting…</span>
                </div>
            </div>
            <div class="banner-brand" id="banner-brand">SOLARIS</div>
        </div>
        <div class="menu-divider" aria-hidden="true"></div>

        <!-- Tabs — rendered dynamically by JS -->
        <div class="tabs"></div>
        <div class="menu-divider" aria-hidden="true"></div>

        <!-- Scrollbar — outside panel, left of list -->
        <div class="scroll-track" id="scroll-track">
            <span class="scroll-arrow-top">▲</span>
            <div class="scroll-track-inner" id="scroll-track-inner">
                <div class="scroll-thumb" id="scroll-thumb"></div>
            </div>
            <span class="scroll-arrow-bottom">▼</span>
        </div>

        <!-- Content Area -->
        <div class="content">
            <div class="content-main">
                <div class="menu-selector" id="menu-selector" aria-hidden="true"></div>
                <div class="menu-viewport" id="menu-viewport">
                    <div class="menu-list" id="menu-list">
                        <!-- Javascript will inject list items here -->
                    </div>
                </div>
            </div>
        </div>
        <div class="menu-divider" aria-hidden="true"></div>

        <!-- Footer -->
        <div class="footer">
            <span class="discord">discord.gg/solarismenu</span>
            <span class="page-count" id="page-count"></span>
        </div>
    </div>

    <!-- Notification toasts injected here by the bridge -->
    <div class="toast-stack" id="toast-stack"></div>

    <script src="script.js"></script>
</body>
</html>
